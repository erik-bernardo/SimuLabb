<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura Kawaii do Código</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS KAWAII E VARIÁVEIS --- */
        :root {
            --bg-color: #fff0f5; /* LavenderBlush */
            --path-color: #fffaf0; /* FloralWhite */
            --wall-color: #a8e6cf; /* Soft Mint Green / Bush */
            --wall-shadow: #88cfae;
            --start-color: #b5ead7; /* Light Mint */
            --goal-color: #ffdac1; /* Pastel Peach/Yellow */
            --text-color: #6d6875; /* Soft Dark Violet */
            
            --btn-fwd: #ff9aa2; /* Pastel Pink */
            --btn-left: #c7ceea; /* Pastel Blue */
            --btn-right: #e2f0cb; /* Pastel Green */
            --btn-play: #ffb7b2; /* Melon */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Fundo de bolinhas fofas */
            background-image: radial-gradient(#ffb7b2 2px, transparent 2px);
            background-size: 40px 40px;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        /* --- TABULEIRO --- */
        #game-board-container {
            background: white;
            padding: 12px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 183, 178, 0.4);
            border: 4px solid #ffdac1;
            position: relative;
        }

        #game-board {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            display: grid;
            background-color: var(--path-color);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ffdac1;
        }

        /* Células */
        .cell {
            width: 100%;
            height: 100%;
            border: 1px dashed rgba(255, 183, 178, 0.3);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell-wall {
            background-color: var(--wall-color);
            border-radius: 30%;
            transform: scale(0.85);
            box-shadow: inset 0 -6px 0 var(--wall-shadow), 0 4px 6px rgba(0,0,0,0.1);
        }

        .cell-start {
            background-color: var(--start-color);
            border: 2px dashed #8bcba7;
        }

        .cell-goal {
            background-color: var(--goal-color);
            border: 2px dashed #ffbda1;
            animation: pulse-goal 2s infinite;
        }

        @keyframes pulse-goal {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        /* --- O PERSONAGEM --- */
        #player {
            position: absolute;
            top: 0;
            left: 0;
            /* Tamanho dinâmico ajustado via JS */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
        }

        /* --- BOTÕES E UI --- */
        .btn-kawaii {
            border-radius: 9999px; /* Pill shape */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
        }

        .btn-kawaii:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .btn-kawaii:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }

        .cmd-chip {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 3px 0 rgba(0,0,0,0.05);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- MODAIS --- */
        .modal-overlay {
            backdrop-filter: blur(4px);
            background: rgba(255, 240, 245, 0.7);
        }

        .modal-box {
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 4px solid white;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Estrela fofa animada */
        .cute-star {
            animation: spin-slow 6s linear infinite;
        }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl w-full mx-auto flex flex-col md:flex-row gap-8 items-center md:items-start">
        
        <!-- ESQUERDA: JOGO E STATUS -->
        <div class="w-full md:w-1/2 flex flex-col items-center">
            <div class="bg-white px-6 py-3 rounded-full shadow-md border-2 border-pink-100 mb-6 flex justify-between w-full max-w-[450px]">
                <span class="font-bold text-pink-400 text-lg">Nível <span id="level-display">1</span></span>
                <span class="font-bold text-blue-400 text-lg">Grade: <span id="size-display">5x5</span></span>
            </div>

            <div id="game-board-container" class="w-full">
                <div id="game-board">
                    <!-- Gerado via JS -->
                </div>
                <!-- O Personagem: SVG Inline Fofinho -->
                <div id="player">
                    <svg viewBox="0 0 100 100" class="w-[80%] h-[80%] drop-shadow-md">
                        <!-- Mãos para cima (apontando pro Norte) -->
                        <circle cx="28" cy="20" r="10" fill="#ffc8a2" />
                        <circle cx="72" cy="20" r="10" fill="#ffc8a2" />
                        <!-- Corpo -->
                        <rect x="25" y="40" width="50" height="35" rx="15" fill="#a0e8af" stroke="#7ad08e" stroke-width="3" />
                        <path d="M 35 40 L 65 40 L 50 25 Z" fill="#7ad08e" opacity="0.5"/> <!-- Detalhe da roupa -->
                        <!-- Cabeça -->
                        <circle cx="50" cy="45" r="22" fill="#ffc8a2" />
                        <!-- Cabelo fofo -->
                        <path d="M 25 45 C 25 15, 75 15, 75 45 C 65 30, 35 30, 25 45 Z" fill="#8d5524" />
                        <!-- Olhinhos e Bochechas -->
                        <circle cx="41" cy="42" r="3" fill="#333" />
                        <circle cx="59" cy="42" r="3" fill="#333" />
                        <ellipse cx="34" cy="47" rx="5" ry="3" fill="#ff9999" opacity="0.7"/>
                        <ellipse cx="66" cy="47" rx="5" ry="3" fill="#ff9999" opacity="0.7"/>
                        <!-- Boquinha -->
                        <path d="M 46 50 Q 50 54 54 50" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- DIREITA: PAINEL DE PROGRAMAÇÃO -->
        <div class="w-full md:w-1/2 bg-white rounded-3xl p-6 shadow-xl border-4 border-pink-50 flex flex-col gap-6 h-full max-h-[650px]">
            
            <div>
                <h2 class="text-xl font-extrabold text-pink-400 mb-4 flex items-center gap-2">
                    <span>✨</span> Ações Mágicas
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <button onclick="addCmd('FORWARD')" class="btn-kawaii bg-[var(--btn-fwd)] hover:brightness-105 text-white py-3 px-2 text-sm sm:text-xs md:text-sm">
                        ⬆️ Avançar
                    </button>
                    <button onclick="addCmd('LEFT')" class="btn-kawaii bg-[var(--btn-left)] hover:brightness-105 text-white py-3 px-2 text-sm sm:text-xs md:text-sm">
                        ⬅️ Esq
                    </button>
                    <button onclick="addCmd('RIGHT')" class="btn-kawaii bg-[var(--btn-right)] hover:brightness-105 text-white py-3 px-2 text-sm sm:text-xs md:text-sm">
                        Dir ➡️
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-[200px]">
                <h2 class="text-xl font-extrabold text-blue-400 mb-3 flex items-center gap-2">
                    <span>📝</span> Caminho
                </h2>
                <div id="queue-box" class="flex-1 bg-pink-50 rounded-2xl border-2 border-dashed border-pink-200 p-4 flex flex-wrap content-start gap-2 overflow-y-auto">
                    <p id="empty-txt" class="text-pink-300 font-bold w-full text-center mt-8">O que eu devo fazer?</p>
                </div>
            </div>

            <div class="flex gap-3 mt-auto">
                <button id="btn-clear" onclick="clearCmds()" class="btn-kawaii w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-500 py-4 text-sm">
                    Limpar
                </button>
                <button id="btn-play" onclick="playTurn()" class="btn-kawaii w-2/3 bg-[var(--btn-play)] hover:brightness-105 text-white py-4 text-lg">
                    ▶️ Play!
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: DERROTA / BATEU -->
    <div id="modal-loss" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="modal-box bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center">
            <div class="text-6xl mb-4">😵</div>
            <h3 class="text-2xl font-black text-pink-400 mb-2">Oops!</h3>
            <p class="text-gray-500 font-bold mb-6">Você bateu em uma moita ou saiu do mapa. Vamos tentar de novo?</p>
            <button onclick="closeModal('modal-loss')" class="btn-kawaii bg-[var(--btn-fwd)] text-white w-full py-3 text-lg">
                Tentar Novamente
            </button>
        </div>
    </div>

    <!-- MODAL: VITÓRIA -->
    <div id="modal-win" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="modal-box bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center">
            <div class="text-6xl mb-4 cute-star">⭐</div>
            <h3 class="text-3xl font-black text-yellow-400 mb-2">Ebaaa!</h3>
            <p class="text-gray-500 font-bold mb-6">Você chegou na estrelinha e venceu o nível!</p>
            <button onclick="nextLevel()" class="btn-kawaii bg-[var(--btn-right)] text-white w-full py-3 text-lg">
                Próximo Nível ➡️
            </button>
        </div>
    </div>

    <script>
        // --- ESTADO GLOBAL ---
        let level = 1;
        let gridSize = 5;
        let board = []; // 0: Caminho, 1: Parede, 2: Início, 3: Fim
        let queue = [];
        let isPlaying = false;
        
        let player = {
            x: 0,
            y: 0,
            rot: 90 // 0=Norte, 90=Leste(Direita), 180=Sul, 270=Oeste. 
        };

        // Elementos DOM
        const boardEl = document.getElementById('game-board');
        const playerEl = document.getElementById('player');
        const queueBox = document.getElementById('queue-box');
        const emptyTxt = document.getElementById('empty-txt');
        const btnPlay = document.getElementById('btn-play');
        const btnClear = document.getElementById('btn-clear');
        const lvlDisplay = document.getElementById('level-display');
        const sizeDisplay = document.getElementById('size-display');

        // --- GERAÇÃO PROCEDURAL DO LABIRINTO ---
        function generateMaze(size) {
            board = Array(size).fill().map(() => Array(size).fill(0));
            let isPath = Array(size).fill().map(() => Array(size).fill(false));

            // 1. Criar um caminho garantido do (0,0) até (size-1, size-1)
            let x = 0, y = 0;
            isPath[y][x] = true;
            
            while (x < size - 1 || y < size - 1) {
                if (x === size - 1) { y++; }
                else if (y === size - 1) { x++; }
                else { Math.random() < 0.5 ? x++ : y++; }
                isPath[y][x] = true;
            }

            // 2. Preencher com paredes aleatórias as células que NÃO fazem parte do caminho garantido
            // A densidade aumenta conforme o nível
            let wallDensity = 0.2 + (level * 0.05);
            if (wallDensity > 0.45) wallDensity = 0.45; // Limite máximo para não ficar impossível de feio

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!isPath[r][c] && Math.random() < wallDensity) {
                        board[r][c] = 1;
                    }
                }
            }

            // Definir Início e Fim visualmente na lógica (embora sejam caminhos válidos)
            board[0][0] = 2; 
            board[size - 1][size - 1] = 3;
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            // Ajustar tamanho do jogador
            const cellSize = 100 / gridSize;
            playerEl.style.width = `${cellSize}%`;
            playerEl.style.height = `${cellSize}%`;

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    
                    if (board[y][x] === 1) {
                        cell.classList.add('cell-wall');
                    } else if (board[y][x] === 2) {
                        cell.classList.add('cell-start');
                    } else if (board[y][x] === 3) {
                        cell.classList.add('cell-goal');
                        // Adicionar a estrelinha no objetivo
                        cell.innerHTML = `
                            <svg class="w-2/3 h-2/3 text-yellow-500 cute-star" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/>
                            </svg>
                        `;
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        // --- CONTROLES DE PERSONAGEM ---
        function initPlayer() {
            player.x = 0;
            player.y = 0;
            player.rot = 90; // Começa olhando para a direita (Leste)
            updatePlayerVisuals();
        }

        function updatePlayerVisuals() {
            // translate no CSS usa a própria dimensão do elemento.
            // Como o elemento tem o mesmo tamanho da célula, mover 100% é mover 1 célula.
            playerEl.style.transform = `translate(${player.x * 100}%, ${player.y * 100}%) rotate(${player.rot}deg)`;
        }

        // --- SISTEMA DE FILA (PROGRAMAÇÃO) ---
        const cmdIcons = {
            'FORWARD': { text: '⬆️ Avançar', color: 'bg-[var(--btn-fwd)]' },
            'LEFT': { text: '⬅️ Girar Esq', color: 'bg-[var(--btn-left)]' },
            'RIGHT': { text: 'Girar Dir ➡️', color: 'bg-[var(--btn-right)]' }
        };

        function addCmd(cmd) {
            if (isPlaying) return;
            queue.push(cmd);
            renderQueue();
        }

        function clearCmds() {
            if (isPlaying) return;
            queue = [];
            renderQueue();
            initPlayer(); // Reseta para a posição inicial ao limpar
        }

        function renderQueue() {
            queueBox.innerHTML = '';
            if (queue.length === 0) {
                queueBox.appendChild(emptyTxt);
                emptyTxt.style.display = 'block';
                return;
            }
            emptyTxt.style.display = 'none';

            queue.forEach((cmd, idx) => {
                const div = document.createElement('div');
                div.className = `cmd-chip text-white font-bold text-xs px-3 py-2 rounded-full ${cmdIcons[cmd].color}`;
                div.innerText = cmdIcons[cmd].text;
                div.id = `cmd-${idx}`;
                queueBox.appendChild(div);
            });
        }

        // --- MOTOR DE EXECUÇÃO ---
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function playTurn() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            btnPlay.disabled = true;
            btnClear.disabled = true;

            // Garante que o jogador está na origem antes de rodar
            initPlayer();
            await sleep(400);

            let crashed = false;

            for (let i = 0; i < queue.length; i++) {
                const cmd = queue[i];
                
                // Highlight visual no comando atual
                const chip = document.getElementById(`cmd-${i}`);
                if (chip) chip.classList.add('ring-4', 'ring-white', 'scale-110');

                if (cmd === 'LEFT') {
                    player.rot -= 90;
                } else if (cmd === 'RIGHT') {
                    player.rot += 90;
                } else if (cmd === 'FORWARD') {
                    // Normalizar graus (0=Norte, 90=Leste, 180=Sul, 270=Oeste)
                    let dir = ((player.rot % 360) + 360) % 360; 
                    
                    if (dir === 0) player.y -= 1;
                    else if (dir === 90) player.x += 1;
                    else if (dir === 180) player.y += 1;
                    else if (dir === 270) player.x -= 1;
                }

                updatePlayerVisuals();
                await sleep(500); // Tempo para ver a animação acontecer

                if (chip) chip.classList.remove('ring-4', 'ring-white', 'scale-110');

                // Checagem de Colisão (Saiu da grade ou bateu na parede)
                if (
                    player.x < 0 || player.x >= gridSize ||
                    player.y < 0 || player.y >= gridSize ||
                    board[player.y][player.x] === 1
                ) {
                    crashed = true;
                    showModal('modal-loss');
                    break;
                }
            }

            // Fim da execução sem bater
            if (!crashed) {
                // Checa se está no bloco final (3)
                if (board[player.y][player.x] === 3) {
                    showModal('modal-win');
                } else {
                    // Parou no meio do caminho sem bater
                    // Não foi pedido alert específico para isso, então apenas reseto as flags para ele tentar novamente
                }
            }

            isPlaying = false;
            btnPlay.disabled = false;
            btnClear.disabled = false;
        }

        // --- NÍVEIS E FLUXO ---
        function loadLevel(lvl) {
            level = lvl;
            gridSize = 3 + (level * 2); // lvl 1 = 5x5, lvl 2 = 7x7, lvl 3 = 9x9...
            
            lvlDisplay.innerText = level;
            sizeDisplay.innerText = `${gridSize}x${gridSize}`;
            
            generateMaze(gridSize);
            renderBoard();
            
            queue = [];
            renderQueue();
            initPlayer();
        }

        function nextLevel() {
            closeModal('modal-win');
            loadLevel(level + 1);
        }

        // --- MODAIS ---
        function showModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('hidden');
            if (id === 'modal-loss') {
                initPlayer(); // Volta o personagem pro começo
            }
        }

        // --- INICIALIZAÇÃO DA PÁGINA ---
        window.onload = () => {
            loadLevel(1);
        };

    </script>
</body>
</html>
