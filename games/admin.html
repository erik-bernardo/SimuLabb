<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Gerador de Conteúdo | SimuLab</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    /* Admin Theme */
    --admin-bg: #f3f4f6;
    --admin-card: #ffffff;
    --admin-text: #1f2937;
    --admin-border: #e5e7eb;
    --admin-primary: #ff6900;
    --admin-primary-dark: #e85b00;
    
    /* Sim & Game Variables Fallbacks */
    --orange: #ff6900;
    --blue: #142b46;
    --muted: #65758b;
    --shadow: 0 5px 18px rgba(24, 49, 74, .07);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background: var(--admin-bg); 
    color: var(--admin-text); 
    font-family: 'Poppins', sans-serif;
    padding: 20px;
  }
  
  .container { max-width: 1280px; margin: 0 auto; }
  
  /* Header & Tabs */
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { font-weight: 800; color: var(--admin-primary); display: flex; align-items: center; justify-content: center; gap: 10px;}
  
  .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .tab-btn {
    padding: 12px 24px; border: none; border-radius: 8px; background: #e5e7eb;
    color: #4b5563; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 14px;
  }
  .tab-btn:hover { background: #d1d5db; }
  .tab-btn.active { background: var(--admin-primary); color: white; box-shadow: 0 4px 12px #ff690040; }

  /* Layout */
  .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .panel {
    background: var(--admin-card); border: 1px solid var(--admin-border);
    border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .panel h2 { font-size: 18px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--admin-border); }
  
  /* Form Elements */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #4b5563; }
  .form-control {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-family: inherit; font-size: 14px; transition: 0.2s;
  }
  textarea.form-control { resize: vertical; min-height: 80px; }
  .form-control:focus { outline: none; border-color: var(--admin-primary); box-shadow: 0 0 0 3px #ff690020; }
  
  /* Output Area */
  .code-output {
    width: 100%; height: 180px; padding: 15px; background: #1e1e1e; color: #d4d4d4; 
    font-family: 'Consolas', monospace; border-radius: 8px; border: none; resize: none; margin-bottom: 15px;
    font-size: 13px; line-height: 1.5; white-space: pre;
  }
  .copy-btn {
    width: 100%; background: var(--admin-primary); color: white; border: none; padding: 12px; 
    border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px;
    display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  .copy-btn:hover { background: var(--admin-primary-dark); }
  
  /* Preview Container */
  .preview-container {
    display: flex; justify-content: center; align-items: center; 
    padding: 30px; background: var(--admin-bg); border-radius: 8px; border: 1px dashed #9ca3af;
    margin-bottom: 20px; min-height: 250px;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* =========================================
     CSS DOS COMPONENTES VISUAIS PARA PREVIEW
     ========================================= */
  
  /* 1. JOGOS (Herdado do site original, usa Nunito Sans) */
  .game-card {
    font-family: "Nunito Sans", sans-serif;
    width: 250px; background: #fff; border: 1px solid #dfe6ee; border-radius: 11px;
    overflow: hidden; box-shadow: 0 2px 5px #14233d04; transition: transform .18s;
  }
  .game-thumb { height: 120px; position: relative; overflow: hidden; background: #e8eef5; }
  .game-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .game-tag {
    position: absolute; left: 8px; bottom: 7px; border-radius: 6px; padding: 4px 7px;
    background: #fff; box-shadow: 0 1px 5px #10203020; font-size: 10px; font-weight: 900; color: #1765cf;
  }
  .game-tag.physics { color: #b96b00; }
  .game-tag.chemistry { color: #0d9a4c; }
  .game-tag.biology { color: #378b22; }
  .game-tag.programming { color: #8a42d7; }
  .game-tag.other { color: #c04d9b; }
  .game-info { padding: 10px 10px 11px; }
  .game-info h3 { font-size: 13px; line-height: 1.25; margin: 0 0 6px; font-weight: 900; color:#14233d; }
  .game-info p { font-size: 11.5px; color: #56657b; line-height: 1.38; margin: 0 0 10px; min-height: 46px; }
  .play-btn {
    background: #ff690b; color: white; border: 0; border-radius: 7px; padding: 8px 13px;
    font-size: 12px; font-weight: 900; display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
  }

  /* 2. SIMULADORES (Herdado de simulacoes.html, usa Poppins) */
  .sim-card {
    font-family: "Poppins", sans-serif;
    width: 250px; /* Fixado para o preview */
    position: relative; min-height: 175px; display: flex; flex-direction: column; 
    background: white; border: 1px solid #e8edf3; border-radius: 13px; 
    padding: 18px 17px 15px; box-shadow: var(--shadow); overflow: hidden;
  }
  .sim-card::before {
    content: ""; position: absolute; height: 3px; top: 0; left: 0; right: 0; 
    background: var(--subject-color, var(--orange)); opacity: 1; 
  }
  .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
  .card-icon {
    width: 43px; height: 43px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; 
    border-radius: 13px; background: var(--subject-bg, #fff0df); color: var(--subject-color, var(--orange)); font-size: 20px;
  }
  .card-top h3 { font-size: 13px; line-height: 1.4; color: var(--blue); font-weight: 700; margin:0;}
  .subject-tag {
    display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; border-radius: 6px; 
    padding: 4px 8px; font-size: 10px; font-weight: 600; margin-bottom: 9px; 
    color: var(--subject-color, var(--orange)); background: var(--subject-bg, #fff0df);
  }
  .sim-card p { color: var(--muted); font-size: 11px; line-height: 1.65; margin: 0 0 15px; flex: 1; }
  .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .open-sim {
    display: inline-flex; justify-content: center; align-items: center; gap: 8px; border-radius: 8px; 
    padding: 9px 13px; background: var(--orange); color: white; font-size: 11px; font-weight: 600; text-decoration: none;
  }
  .card-arrow {
    display: flex; align-items: center; justify-content: center; width: 29px; height: 29px; 
    border-radius: 50%; color: var(--orange); background: #fff0df; font-size: 12px;
  }

</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="fa-solid fa-layer-group"></i> SimuLab Admin</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tabGames')"><i class="fa-solid fa-gamepad"></i> Gerador de Jogos</button>
    <button class="tab-btn" onclick="switchTab('tabSimulators')"><i class="fa-solid fa-calculator"></i> Gerador de Simuladores</button>
  </div>

  <!-- ABA 1: JOGOS -->
  <div id="tabGames" class="tab-content active grid-layout">
    <div class="panel">
      <h2>Dados do Jogo</h2>
      <form id="formGame">
        <div class="form-group">
          <label>Título (title)</label>
          <input type="text" class="form-control" id="gTitle" value="Doom">
        </div>
        <div class="form-group">
          <label>Matéria (subject)</label>
          <select class="form-control" id="gSubject">
            <option value="Matemática">Matemática</option>
            <option value="Física">Física</option>
            <option value="Química">Química</option>
            <option value="Biologia">Biologia</option>
            <option value="Programação">Programação</option>
            <option value="Outros" selected>Outros</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descrição (desc)</label>
          <textarea class="form-control" id="gDesc">Nossa versão do clássico jogo doom</textarea>
        </div>
        <div class="form-group">
          <label>URL da Imagem (img)</label>
          <input type="text" class="form-control" id="gImg" value="https://s2-techtudo.glbimg.com/toCnwVRV3FWISWTVbxrkVN-lJow=/0x0:695x390/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_08fbf48bc0524877943fe86e43087e7a/internal_photos/bs/2021/m/8/yAUPwzTJW2BFGalBElQQ/doom-twitter-bot-tweet2doom-1993.jpg">
        </div>
        <div class="form-group">
          <label>Caminho do Arquivo (href)</label>
          <input type="text" class="form-control" id="gHref" value="games/noeduational_games/doom.html">
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>Preview e Código JSON</h2>
      <div class="preview-container" id="previewGame"></div>
      <textarea class="code-output" id="outGame" readonly></textarea>
      <button class="copy-btn" onclick="copyCode('outGame', this)"><i class="fa-regular fa-copy"></i> Copiar Código JSON</button>
    </div>
  </div>

  <!-- ABA 2: SIMULADORES -->
  <div id="tabSimulators" class="tab-content grid-layout">
    <div class="panel">
      <h2>Dados do Simulador</h2>
      <form id="formSim">
        <div class="form-group">
          <label>Título</label>
          <input type="text" class="form-control" id="sTitle" value="Geometria Plana">
        </div>
        <div class="form-group">
          <label>Matéria</label>
          <select class="form-control" id="sSubject">
            <option value="matematica">Matemática</option>
            <option value="fisica">Física</option>
            <option value="quimica">Química</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea class="form-control" id="sDesc">Explore formas geométricas, áreas, perímetros e suas propriedades.</textarea>
        </div>
        <div class="form-group">
          <label>Link (href)</label>
          <input type="text" class="form-control" id="sHref" value="simulacoes/geometria_plana.html">
        </div>
        <div style="display:flex; gap:15px;">
            <div class="form-group" style="flex:1;">
            <label>Ícone Principal <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" style="font-size:10px; color:#ff6900;">(Procurar)</a></label>
            <input type="text" class="form-control" id="sIcon1" value="fa-chart-area" placeholder="Ex: fa-chart-area">
            </div>
            <div class="form-group" style="flex:1;">
            <label>Ícone Secundário (Seta)</label>
            <input type="text" class="form-control" id="sIcon2" value="fa-shapes" placeholder="Ex: fa-shapes">
            </div>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>Preview e Código HTML</h2>
      <div class="preview-container" id="previewSim"></div>
      <textarea class="code-output" id="outSim" readonly></textarea>
      <button class="copy-btn" onclick="copyCode('outSim', this)"><i class="fa-regular fa-copy"></i> Copiar HTML do Card</button>
    </div>
  </div>

</div>

<script>
  // ================= TABS =================
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // ================= UTILS =================
  function copyCode(elementId, btnElement) {
    const el = document.getElementById(elementId);
    el.select();
    document.execCommand('copy');
    
    const originalText = btnElement.innerHTML;
    btnElement.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
    btnElement.style.background = '#10b981';
    setTimeout(() => {
      btnElement.innerHTML = originalText;
      btnElement.style.background = 'var(--admin-primary)';
    }, 2000);
  }

  // ================= GERADOR DE JOGOS =================
  const gameSubjectClass = {
    "Matemática": "", "Física": "physics", "Química": "chemistry", 
    "Biologia": "biology", "Programação": "programming", "Outros": "other"
  };

  function updateGame() {
    const title = document.getElementById('gTitle').value.trim();
    const subject = document.getElementById('gSubject').value;
    const desc = document.getElementById('gDesc').value.trim();
    const img = document.getElementById('gImg').value.trim();
    const href = document.getElementById('gHref').value.trim();

    // Atualiza JSON
    const codeString = `{title:"${title}",subject:"${subject}",desc:"${desc}",img:"${img}",href:"${href}"}`;
    document.getElementById('outGame').value = codeString + ",";

    // Atualiza Preview
    const cls = gameSubjectClass[subject] || "other";
    document.getElementById('previewGame').innerHTML = `
      <article class="game-card">
        <div class="game-thumb">
          <img src="${img}" onerror="this.style.display='none';">
          <span class="game-tag ${cls}">${subject}</span>
        </div>
        <div class="game-info">
          <h3>${title || 'Título'}</h3>
          <p>${desc || 'Descrição'}</p>
          <a href="#" class="play-btn" onclick="event.preventDefault()">🎮 Jogar <span>→</span></a>
        </div>
      </article>
    `;
  }

  // ================= GERADOR DE SIMULADORES =================
  const simSubjectsData = {
    "matematica": { color: "#1685e8", bg: "#e8f3ff", tag: "∑ Matemática" },
    "fisica": { color: "#d9910b", bg: "#fff4d8", tag: "⚛ Física" },
    "quimica": { color: "#19a568", bg: "#e3f8ed", tag: "⚗ Química" }
  };

  function updateSim() {
    const title = document.getElementById('sTitle').value.trim();
    const subjectKey = document.getElementById('sSubject').value;
    const desc = document.getElementById('sDesc').value.trim();
    const href = document.getElementById('sHref').value.trim();
    const icon1 = document.getElementById('sIcon1').value.trim();
    const icon2 = document.getElementById('sIcon2').value.trim();

    const data = simSubjectsData[subjectKey];

    // Monta o HTML string formatado corretamente para copiar
    const htmlCode = `<article class="sim-card" data-subject="${subjectKey}" data-name="${title}" style="--subject-color:${data.color};--subject-bg:${data.bg}">
    <div class="card-top">
        <div class="card-icon"><i class="fa-solid ${icon1}"></i></div>
        <h3>${title}</h3>
    </div>
    <span class="subject-tag">${data.tag}</span>
    <p>${desc}</p>
    <div class="card-bottom">
        <a href="${href}" class="open-sim">Explorar <i class="fa-solid fa-arrow-right"></i></a>
        <span class="card-arrow"><i class="fa-solid ${icon2}"></i></span>
    </div>
</article>`;

    document.getElementById('outSim').value = htmlCode;
    document.getElementById('previewSim').innerHTML = htmlCode;
    
    // Pequena correção pro botão não navegar no admin
    const linkPreview = document.querySelector('#previewSim .open-sim');
    if(linkPreview) linkPreview.onclick = (e) => e.preventDefault();
  }

  // Registra Listeners
  document.querySelectorAll('#formGame input, #formGame select, #formGame textarea').forEach(el => el.addEventListener('input', updateGame));
  document.querySelectorAll('#formSim input, #formSim select, #formSim textarea').forEach(el => el.addEventListener('input', updateSim));

  // Initialize
  updateGame();
  updateSim();
</script>

</body>
</html>
