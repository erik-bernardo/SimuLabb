<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório de Funções</title>
<style>
  :root {
    --bg: #0a0e1f;
    --bg-grad-1: rgba(124, 92, 255, .22);
    --bg-grad-2: rgba(34, 211, 238, .16);
    --card: rgba(255, 255, 255, .055);
    --card-solid: #12172e;
    --border: rgba(255, 255, 255, .10);
    --txt: #eef1ff;
    --muted: #98a2c7;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --grid: rgba(255, 255, 255, .06);
    --grid-major: rgba(255, 255, 255, .12);
    --axis: rgba(255, 255, 255, .55);
    --curveA: #8b7bff;
    --curveB: #22d3ee;
    --root: #34d399;
    --yint: #fbbf24;
    --pop: rgba(20, 25, 52, .94);
    --shadow: 0 20px 50px rgba(0, 0, 0, .45);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #f3f5ff;
    --bg-grad-1: rgba(124, 92, 255, .16);
    --bg-grad-2: rgba(34, 211, 238, .16);
    --card: rgba(255, 255, 255, .8);
    --card-solid: #ffffff;
    --border: rgba(30, 40, 90, .10);
    --txt: #151a3a;
    --muted: #5d6796;
    --grid: rgba(30, 40, 90, .06);
    --grid-major: rgba(30, 40, 90, .12);
    --axis: rgba(21, 26, 58, .65);
    --curveA: #6a4cf5;
    --curveB: #0891b2;
    --root: #059669;
    --yint: #d97706;
    --pop: rgba(255, 255, 255, .97);
    --shadow: 0 20px 50px rgba(40, 50, 110, .18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--txt);
    background:
      radial-gradient(900px 500px at 8% -10%, var(--bg-grad-1), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, var(--bg-grad-2), transparent 60%),
      var(--bg);
    transition: background .4s, color .3s;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1280px; margin: 0 auto; padding: 20px 18px 36px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 24px rgba(124, 92, 255, .4);
    font-weight: 800; font-style: italic; font-size: 18px; color: #fff;
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

  .icon-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--txt);
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 17px;
    backdrop-filter: blur(10px); transition: transform .2s, background .2s;
  }
  .icon-btn:hover { transform: translateY(-1px); }
  .icon-btn:active { transform: scale(.95); }

  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 22px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
  }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .side .card { padding: 16px; }
  .label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  /* Seletor segmentado */
  .seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 15px; background: rgba(127, 127, 160, .12); }
  .seg::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 8px) / 3); border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    box-shadow: 0 6px 18px rgba(124, 92, 255, .45);
    transform: translateX(calc(var(--i, 1) * 100%));
    transition: transform .35s cubic-bezier(.5, 1.4, .5, 1);
  }
  .seg button {
    position: relative; z-index: 1; border: 0; background: transparent; color: var(--muted);
    padding: 11px 4px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; border-radius: 11px;
    transition: color .25s;
  }
  .seg button small { display: block; font-weight: 500; font-size: 10.5px; opacity: .8; margin-top: 2px; }
  .seg button.on { color: #fff; }

  .equation {
    margin-top: 14px; padding: 14px 14px; border-radius: 14px; text-align: center;
    background: rgba(127, 127, 160, .1); border: 1px dashed var(--border);
    font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: -.01em; word-break: break-word;
  }

  /* Sliders */
  .sl { display: grid; grid-template-columns: 22px 1fr 46px; align-items: center; gap: 10px; margin-bottom: 11px; }
  .sl:last-child { margin-bottom: 0; }
  .sl b { font-family: var(--mono); font-size: 14px; color: var(--accent-2); }
  .sl output { font-family: var(--mono); font-size: 13px; text-align: right; }
  .sl small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; margin-top: -8px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, var(--accent) var(--pct, 50%), rgba(127,127,160,.25) var(--pct, 50%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    border: 3px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .15s;
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2); }

  .ghost {
    margin-top: 12px; width: 100%; padding: 10px; border-radius: 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all .2s;
  }
  .ghost:hover { color: var(--txt); border-color: var(--accent); }

  /* Pontos de interesse */
  .chips { display: flex; flex-direction: column; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 13px; cursor: pointer;
    border: 1px solid var(--border); background: rgba(127,127,160,.08); color: var(--txt); font: inherit; text-align: left;
    transition: transform .2s, border-color .2s, background .2s; animation: pop .4s both;
  }
  .chip:hover { transform: translateX(3px); border-color: var(--accent); background: rgba(124,92,255,.12); }
  .chip i { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 22%, transparent); }
  .chip.root i { background: var(--root); color: var(--root); }
  .chip.yint i { background: var(--yint); color: var(--yint); }
  .chip span { font-size: 13px; font-weight: 650; }
  .chip em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .empty { font-size: 13px; color: var(--muted); padding: 4px 2px; }

  .tip { font-size: 13px; line-height: 1.55; color: var(--muted); }
  .tip b { color: var(--txt); }
  .tip code { font-family: var(--mono); background: rgba(127,127,160,.16); padding: 1px 6px; border-radius: 6px; color: var(--txt); font-size: 12px; }

  /* Palco */
  .stage { position: relative; overflow: hidden; height: clamp(420px, 72vh, 700px); padding: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .readout {
    position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 3; pointer-events: none;
  }
  .pill {
    font-family: var(--mono); font-size: 12px; padding: 6px 11px; border-radius: 99px;
    background: var(--pop); border: 1px solid var(--border); backdrop-filter: blur(8px);
  }
  .pill.hint { font-family: inherit; color: var(--muted); }
  .zoom { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
  .zoom .icon-btn { width: 38px; height: 38px; background: var(--pop); font-weight: 700; }
  .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; font-size: 12px; color: var(--muted); z-index: 2; pointer-events: none; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* Balão */
  .balloon {
    position: absolute; left: 0; top: 0; z-index: 5; width: 330px; max-width: calc(100% - 20px);
    background: var(--pop); border: 1px solid var(--border); border-radius: 18px; padding: 14px 15px 13px;
    box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    opacity: 0; visibility: hidden; transform: translate3d(0, 0, 0) scale(.94); transform-origin: 0 100%;
    transition: opacity .25s, visibility .25s;
  }
  .balloon.show { opacity: 1; visibility: visible; }
  .balloon .bh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; letter-spacing: .02em; }
  .badge.root { background: color-mix(in srgb, var(--root) 18%, transparent); color: var(--root); }
  .badge.yint { background: color-mix(in srgb, var(--yint) 20%, transparent); color: var(--yint); }
  .badge.both { background: linear-gradient(90deg, color-mix(in srgb, var(--root) 20%, transparent), color-mix(in srgb, var(--yint) 20%, transparent)); color: var(--txt); }
  .badge.free { background: rgba(124,92,255,.18); color: var(--accent); }
  [data-theme="dark"] .badge.free, :root:not([data-theme]) .badge.free { color: #b4a5ff; }
  .x-btn { border: 0; background: rgba(127,127,160,.16); color: var(--txt); width: 26px; height: 26px; border-radius: 9px; cursor: pointer; font-size: 14px; line-height: 1; }
  .x-btn:hover { background: rgba(244,63,94,.25); }
  .ln { opacity: 0; animation: lineIn .45s forwards; }
  .noanim .ln { opacity: 1; animation: none; }
  .l-intro { font-size: 14px; font-weight: 600; margin-bottom: 9px; }
  .l-intro b { color: var(--accent-2); }
  .steps { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 11px; }
  .l-f { font-family: var(--mono); font-size: 13.5px; word-break: break-word; }
  .l-f.dim { color: var(--muted); }
  .l-f.res { font-weight: 700; color: var(--txt); background: linear-gradient(90deg, rgba(124,92,255,.22), transparent); padding: 4px 8px; margin-left: -8px; border-radius: 8px; }
  .l-note { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .l-note b { color: var(--txt); }

  .balloon.dock {
    left: 10px !important; right: 10px; bottom: 10px; top: auto !important; width: auto; max-width: none;
    transform: translateY(14px) !important; transition: opacity .25s, transform .3s, visibility .25s;
  }
  .balloon.dock.show { transform: translateY(0) !important; }

  @keyframes lineIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .stage { order: -1; height: clamp(400px, 62vh, 560px); }
  }
  @media (max-width: 520px) {
    .app { padding: 14px 12px 28px; }
    .brand p { display: none; }
    .equation { font-size: 16px; }
    .legend { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">f(x)</div>
      <div>
        <h1>Laboratório de Funções</h1>
        <p>Clique no gráfico e veja a conta, passo a passo</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">☾</button>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="card">
        <p class="label">Tipo de função</p>
        <div class="seg" id="seg">
          <button data-deg="1">1º grau<small>reta</small></button>
          <button data-deg="2" class="on">2º grau<small>parábola</small></button>
          <button data-deg="3">3º grau<small>cúbica</small></button>
        </div>
        <div class="equation" id="equation"></div>
      </section>

      <section class="card">
        <p class="label">Coeficientes</p>
        <div id="sliders"></div>
        <button class="ghost" id="resetBtn">↺ Voltar ao exemplo</button>
      </section>

      <section class="card">
        <p class="label">Pontos de interesse</p>
        <div class="chips" id="chips"></div>
      </section>

      <section class="card">
        <p class="label">Entendendo a função</p>
        <div class="tip" id="tip"></div>
      </section>
    </aside>

    <main class="card stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="readout">
        <div class="pill hint" id="hint">Clique em qualquer ponto do gráfico</div>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="zIn" aria-label="Aproximar">+</button>
        <button class="icon-btn" id="zOut" aria-label="Afastar">−</button>
        <button class="icon-btn" id="zReset" aria-label="Zoom padrão" style="font-size:14px">⟲</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--root)"></i>raízes (y = 0)</span>
        <span><i style="background:var(--yint)"></i>corte no eixo y (x = 0)</span>
      </div>
      <div class="balloon" id="balloon" role="dialog" aria-live="polite"></div>
    </main>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const SUP = ['', '', '²', '³'];

  /* ---------- Formatação (pt-BR) ---------- */
  const r4 = (n) => { const v = Number(n.toFixed(4)); return Object.is(v, -0) ? 0 : v; };
  const fmt = (n) => String(r4(n)).replace('.', ',');
  const isInt = (n) => Math.abs(n - Math.round(n)) < 1e-9;
  const fmtPt = (x, y) => `(${fmt(x)}${isInt(x) && isInt(y) ? ', ' : '; '}${fmt(y)})`;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------- Matemática ---------- */
  // coeficientes em ordem crescente de potência: [c0, c1, c2, c3]
  const PRESETS = { 1: [-4, 2, 0, 0], 2: [-4, 0, 1, 0], 3: [0, -1, 0, 1] };
  const COEF_INFO = {
    1: [{ p: 1, n: 'a', d: 'coeficiente de x' }, { p: 0, n: 'b', d: 'termo independente' }],
    2: [{ p: 2, n: 'a', d: 'coeficiente de x²' }, { p: 1, n: 'b', d: 'coeficiente de x' }, { p: 0, n: 'c', d: 'termo independente' }],
    3: [{ p: 3, n: 'a', d: 'coeficiente de x³' }, { p: 2, n: 'b', d: 'coeficiente de x²' }, { p: 1, n: 'c', d: 'coeficiente de x' }, { p: 0, n: 'd', d: 'termo independente' }]
  };

  const evalP = (c, x) => ((c[3] * x + c[2]) * x + c[1]) * x + c[0];

  function realRoots(d) { // d em ordem decrescente
    const n = d.length - 1, a = d[0];
    if (n === 1) return [-d[1] / a];
    if (n === 2) {
      const [A, B, C] = d, D = B * B - 4 * A * C;
      if (D < -1e-12) return [];
      if (Math.abs(D) < 1e-12) return [-B / (2 * A)];
      const s = Math.sqrt(D);
      return [(-B - s) / (2 * A), (-B + s) / (2 * A)].sort((p, q) => p - q);
    }
    const crit = realRoots([3 * d[0], 2 * d[1], d[2]]);
    const R = 1 + Math.max(...d.slice(1).map((v) => Math.abs(v / a)));
    const f = (x) => d.reduce((s, c) => s * x + c, 0);
    const pts = [-R, ...crit, R], out = [];
    const add = (r) => { if (!out.some((o) => Math.abs(o - r) < 1e-7)) out.push(r); };
    pts.forEach((p) => { if (Math.abs(f(p)) < 1e-9) add(p); });
    for (let i = 0; i < pts.length - 1; i++) {
      let l = pts[i], h = pts[i + 1];
      const fl = f(l), fh = f(h);
      if (Math.abs(fl) < 1e-9 || Math.abs(fh) < 1e-9 || fl * fh > 0) continue;
      for (let k = 0; k < 100; k++) {
        const m = (l + h) / 2, fm = f(m);
        if ((fl < 0) === (fm < 0)) l = m; else h = m;
      }
      add((l + h) / 2);
    }
    return out.sort((p, q) => p - q);
  }

  function computeSpecial(c, deg) {
    const desc = c.slice(0, deg + 1).reverse();
    const roots = realRoots(desc).map((r) => {
      r = Number(r.toFixed(9));
      return Math.abs(r) < 1e-9 ? 0 : r;
    });
    const pts = roots.map((x) => ({ x, y: 0, root: true, yint: x === 0 }));
    if (!roots.includes(0)) pts.push({ x: 0, y: c[0], root: false, yint: true });
    return pts.sort((p, q) => p.x - q.x);
  }

  /* ---------- Texto das equações ---------- */
  const termsOf = (c, deg) => {
    const t = [];
    for (let p = deg; p >= 0; p--) if (Math.abs(c[p]) > 1e-12) t.push({ c: c[p], p });
    return t;
  };
  const joinTerms = (items) => items.length
    ? items.map((it, i) => (i === 0 ? (it.neg ? '-' : '') : (it.neg ? ' - ' : ' + ')) + it.t).join('')
    : '0';
  const symbolic = (c, deg) => joinTerms(termsOf(c, deg).map(({ c: k, p }) => ({
    neg: k < 0,
    t: (Math.abs(k) === 1 && p > 0 ? '' : fmt(Math.abs(k))) + (p > 0 ? 'x' + SUP[p] : '')
  })));

  function explain(x, c, deg, special) {
    const xr = r4(x), fx = fmt(xr);
    const terms = termsOf(c, deg);
    const paren = (v) => (v < 0 ? `(${fmt(v)})` : fmt(v));

    const substituted = joinTerms(terms.map(({ c: k, p }) => ({
      neg: k < 0,
      t: p > 0 ? (Math.abs(k) === 1 ? '' : fmt(Math.abs(k)) + '·') + `(${fx})` + SUP[p] : fmt(Math.abs(k))
    })));

    const needMid = terms.some(({ c: k, p }) => Math.abs(k) !== 1 && p >= 1);
    const middle = needMid ? joinTerms(terms.map(({ c: k, p }) => ({
      neg: k < 0,
      t: p === 0 ? fmt(Math.abs(k))
        : (Math.abs(k) === 1 ? paren(Math.pow(xr, p)) : fmt(Math.abs(k)) + '·' + paren(Math.pow(xr, p)))
    }))) : null;

    let total = 0;
    const evaluated = joinTerms(terms.map(({ c: k, p }) => {
      const v = k * Math.pow(xr, p);
      total += v;
      const z = Math.abs(r4(v)) === 0;
      return { neg: !z && v < 0, t: fmt(Math.abs(v)) };
    }));
    let y = r4(total);
    if (Math.abs(total) < 1e-9) y = 0;

    const rootHit = special.find((p) => p.root && Math.abs(p.x - x) < 1e-6);
    const isRoot = !!rootHit || Math.abs(total) < 1e-9;
    const isY = xr === 0;
    const exactRoot = Math.abs(total) < 1e-9;

    const lines = [{ k: 'f dim', h: `f(x) = ${symbolic(c, deg)}` }, { k: 'f', h: `f(${fx}) = ${substituted}` }];
    if (middle && middle !== substituted) lines.push({ k: 'f', h: `f(${fx}) = ${middle}` });
    if (evaluated !== substituted && evaluated !== middle) lines.push({ k: 'f', h: `f(${fx}) = ${evaluated}` });
    lines.push({ k: 'f res', h: isRoot && !exactRoot ? `f(${fx}) ≈ 0` : `f(${fx}) = ${fmt(y)}` });

    const notes = [];
    if (isRoot && exactRoot) notes.push(`<b>f(${fx}) = 0</b>, então x = ${fx} é uma <b>raiz</b>: o gráfico toca o eixo x em ${fmtPt(xr, 0)}.`);
    else if (isRoot) notes.push(`Raiz <b>aproximada</b>: o valor exato é irracional, por isso o resultado fica muito perto de 0, mas não exatamente nele.`);
    if (isY) notes.push(`Em <b>x = 0</b> o gráfico corta o eixo y no ponto ${fmtPt(0, y)}.`);
    if (!isRoot && !isY) notes.push(`Logo, o ponto <b>${fmtPt(xr, y)}</b> pertence ao gráfico de f.`);

    const kind = isRoot && isY ? 'both' : isRoot ? 'root' : isY ? 'yint' : 'free';
    const title = { both: 'Raiz e corte no eixo y', root: 'Raiz da função', yint: 'Corte no eixo y', free: 'Ponto do gráfico' }[kind];
    return { fx, y, kind, title, lines, notes };
  }

  /* ---------- Estado ---------- */
  const st = {
    deg: 2,
    target: PRESETS[2].slice(),
    cur: PRESETS[2].slice(),
    special: [],
    sel: null,          // { x }
    hover: null,
    zoom: 1,
    view: { xh: 6.5, yh: 8 },
    pointsT: performance.now()
  };

  /* ---------- Canvas ---------- */
  const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
  const balloon = $('#balloon');
  let W = 0, H = 0, dpr = 1, colors = {};

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    const g = (n) => s.getPropertyValue(n).trim();
    colors = {
      grid: g('--grid'), major: g('--grid-major'), axis: g('--axis'), txt: g('--txt'), muted: g('--muted'),
      a: g('--curveA'), b: g('--curveB'), root: g('--root'), yint: g('--yint'), pop: g('--pop'), accent: g('--accent'), card: g('--card-solid')
    };
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    balloon.classList.toggle('dock', W < 640);
    kick();
  }
  new ResizeObserver(resize).observe(stage);

  const sx = (x) => W / 2 + x * (W / (2 * st.view.xh));
  const sy = (y) => H / 2 - y * (H / (2 * st.view.yh));
  const ix = (px) => (px - W / 2) / (W / (2 * st.view.xh));

  function niceStep(range, ticks) {
    const raw = range / Math.max(ticks, 1), pow = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / pow;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pow;
  }

  function viewTarget() {
    let xm = 6.5, ym = 8;
    st.special.forEach((p) => { xm = Math.max(xm, Math.abs(p.x) * 1.25); });
    ym = Math.max(ym, Math.abs(st.target[0]) * 1.3);
    if (st.deg === 2 && Math.abs(st.target[2]) > 1e-9) {
      const xv = -st.target[1] / (2 * st.target[2]);
      xm = Math.max(xm, Math.abs(xv) * 1.3);
      ym = Math.max(ym, Math.abs(evalP(st.target, xv)) * 1.25);
    }
    return { xh: Math.min(xm, 40) / st.zoom, yh: Math.min(ym, 60) / st.zoom };
  }

  /* ---------- Desenho ---------- */
  const easeOutBack = (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    const { xh, yh } = st.view;

    // grade
    const stepX = niceStep(2 * xh, W / 75), stepY = niceStep(2 * yh, H / 60);
    ctx.lineWidth = 1;
    ctx.font = '11.5px ui-monospace, Menlo, Consolas, monospace';
    for (let x = Math.ceil(-xh / stepX) * stepX; x <= xh; x += stepX) {
      const px = Math.round(sx(x)) + .5;
      ctx.strokeStyle = colors.grid; ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    }
    for (let y = Math.ceil(-yh / stepY) * stepY; y <= yh; y += stepY) {
      const py = Math.round(sy(y)) + .5;
      ctx.strokeStyle = colors.grid; ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
    }
    // eixos
    ctx.strokeStyle = colors.axis; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, sy(0)); ctx.lineTo(W, sy(0)); ctx.moveTo(sx(0), 0); ctx.lineTo(sx(0), H); ctx.stroke();
    // rótulos
    ctx.fillStyle = colors.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let x = Math.ceil(-xh / stepX) * stepX; x <= xh; x += stepX) {
      if (Math.abs(x) < stepX / 2) continue;
      ctx.fillText(fmt(x), sx(x), clamp(sy(0) + 7, 4, H - 18));
    }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let y = Math.ceil(-yh / stepY) * stepY; y <= yh; y += stepY) {
      if (Math.abs(y) < stepY / 2) continue;
      ctx.fillText(fmt(y), clamp(sx(0) - 8, 30, W - 6), sy(y));
    }
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('0', sx(0) - 7, sy(0) + 6);
    ctx.fillStyle = colors.txt; ctx.font = 'italic 600 13px Inter, system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('x', W - 16, clamp(sy(0) - 8, 16, H - 6));
    ctx.textBaseline = 'top'; ctx.fillText('y', clamp(sx(0) + 9, 4, W - 12), 8 + 44);

    // curva
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, colors.a); grad.addColorStop(1, colors.b);
    ctx.beginPath();
    for (let px = -2, first = true; px <= W + 2; px += 1.5) {
      const y = evalP(st.cur, ix(px));
      const py = clamp(sy(y), -6000, 6000);
      if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = grad; ctx.globalAlpha = .2; ctx.lineWidth = 11; ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 3.6; ctx.stroke();
    ctx.restore();

    // cursor / guia de hover
    if (st.hover && !st.hover.snap) {
      const hx = st.hover.x, hy = evalP(st.cur, hx);
      ctx.save(); ctx.setLineDash([4, 5]); ctx.strokeStyle = colors.muted; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx(hx), 0); ctx.lineTo(sx(hx), H); ctx.stroke(); ctx.restore();
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(sx(hx), sy(hy), 5, 0, 7); ctx.fill();
    }

    // ponto selecionado
    if (st.sel) {
      const x = st.sel.x, y = evalP(st.cur, x), px = sx(x), py = sy(y);
      ctx.save(); ctx.setLineDash([5, 5]); ctx.lineWidth = 1.3; ctx.strokeStyle = colors.accent;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, sy(0)); ctx.moveTo(px, py); ctx.lineTo(sx(0), py); ctx.stroke(); ctx.restore();
      const pulse = (Math.sin(now / 280) + 1) / 2;
      ctx.strokeStyle = colors.accent; ctx.globalAlpha = .55 - pulse * .4; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 11 + pulse * 9, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = colors.accent; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(px, py, 7, 0, 7); ctx.fill(); ctx.stroke();
    }

    // pontos de interesse
    st.special.forEach((p, i) => {
      const t = clamp((now - st.pointsT - 150 - i * 70) / 450, 0, 1);
      if (t <= 0) return;
      const sc = easeOutBack(t);
      const px = sx(p.x), py = sy(p.y);
      const hot = st.hover && st.hover.snap === p;
      const col = p.root ? colors.root : colors.yint;
      const r = (hot ? 10.5 : 8.5) * sc;
      ctx.fillStyle = col; ctx.globalAlpha = hot ? .38 : .22;
      ctx.beginPath(); ctx.arc(px, py, r + 8, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill(); ctx.stroke();
      if (p.root && p.yint) { // raiz em (0,0): contorno amarelo
        ctx.strokeStyle = colors.yint; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, r + 3.5, 0, 7); ctx.stroke();
      }
      ctx.globalAlpha = clamp(t * 1.5, 0, 1);
      ctx.font = '600 12px ui-monospace, Menlo, Consolas, monospace';
      const label = fmtPt(r4(p.x), r4(p.y));
      const tw = ctx.measureText(label).width;
      let lx = px + 14, ly = py - 16;
      if (lx + tw > W - 8) lx = px - 14 - tw;
      if (ly < 40) ly = py + 22;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = colors.card; ctx.strokeText(label, lx, ly);
      ctx.fillStyle = colors.txt; ctx.fillText(label, lx, ly);
      ctx.globalAlpha = 1;
    });
  }

  /* ---------- Loop de animação ---------- */
  let last = performance.now(), running = false;
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    const k = 1 - Math.exp(-dt * 13);
    let moving = false;
    for (let i = 0; i < 4; i++) {
      const d = st.target[i] - st.cur[i];
      if (Math.abs(d) > 1e-4) { st.cur[i] += d * k; moving = true; } else st.cur[i] = st.target[i];
    }
    const vt = viewTarget();
    ['xh', 'yh'].forEach((a) => {
      const d = vt[a] - st.view[a];
      if (Math.abs(d) > 1e-4 * vt[a]) { st.view[a] += d * k; moving = true; } else st.view[a] = vt[a];
    });
    draw(now);
    positionBalloon();
    const animatingPoints = now - st.pointsT < 150 + st.special.length * 70 + 500;
    if (moving || st.sel || animatingPoints) requestAnimationFrame(frame);
    else running = false;
  }

  /* ---------- Balão ---------- */
  function positionBalloon() {
    if (!st.sel || !balloon.classList.contains('show')) return;
    if (balloon.classList.contains('dock')) return;
    const px = sx(st.sel.x), py = sy(evalP(st.cur, st.sel.x));
    const bw = balloon.offsetWidth, bh = balloon.offsetHeight;
    let bx = px + 20, by = py - bh - 16;
    if (bx + bw > W - 10) bx = px - 20 - bw;
    if (bx < 10) bx = 10;
    if (by < 54) by = py + 22;
    by = clamp(by, 54, H - bh - 10);
    balloon.style.transform = `translate3d(${bx}px, ${by}px, 0) scale(1)`;
  }

  function renderBalloon(animate) {
    if (!st.sel) {
      balloon.classList.remove('show');
      balloon.style.transform = 'translate3d(0,0,0) scale(.94)';
      return;
    }
    const e = explain(st.sel.x, st.target, st.deg, st.special);
    balloon.classList.toggle('noanim', !animate);
    const dl = (i) => `style="animation-delay:${animate ? 80 + i * 170 : 0}ms"`;
    let i = 0;
    let html = `
      <div class="bh"><span class="badge ${e.kind}">${e.title}</span>
      <button class="x-btn" id="xBtn" aria-label="Fechar">✕</button></div>
      <div class="l-intro ln" ${dl(i++)}>Você clicou no ponto <b>x = ${e.fx}</b></div>
      <div class="steps">` +
      e.lines.map((l) => `<div class="l-${l.k.split(' ')[0]} ${l.k.includes('dim') ? 'dim' : ''} ${l.k.includes('res') ? 'res' : ''} ln" ${dl(i++)}>${l.h}</div>`).join('') +
      `</div>` +
      e.notes.map((n) => `<div class="l-note ln" ${dl(i++)}>${n}</div>`).join('');
    const wasShown = balloon.classList.contains('show');
    balloon.innerHTML = html;
    balloon.classList.add('show');
    if (!wasShown) {
      // posição inicial sem animar a partir do canto
      balloon.style.transition = 'none';
      positionBalloon();
      void balloon.offsetWidth;
      balloon.style.transition = '';
    }
    $('#xBtn').onclick = () => { st.sel = null; renderBalloon(false); };
    positionBalloon();
    kick();
  }

  /* ---------- Interações no gráfico ---------- */
  function canvasPos(ev) {
    const r = cv.getBoundingClientRect();
    return { px: ev.clientX - r.left, py: ev.clientY - r.top };
  }
  function nearestSpecial(px, py, radius) {
    let best = null, bd = radius;
    st.special.forEach((p) => {
      const d = Math.hypot(sx(p.x) - px, sy(p.y) - py);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }
  function snapX(x) {
    const xh = st.view.xh, step = xh > 15 ? .5 : xh > 3 ? .1 : .05;
    return Number((Math.round(x / step) * step).toFixed(4));
  }

  let down = null;
  cv.addEventListener('pointerdown', (e) => { down = canvasPos(e); });
  cv.addEventListener('pointerup', (e) => {
    if (!down) return;
    const p = canvasPos(e);
    const moved = Math.hypot(p.px - down.px, p.py - down.py);
    down = null;
    if (moved > 8) return;
    const sp = nearestSpecial(p.px, p.py, e.pointerType === 'touch' ? 26 : 16);
    const x = sp ? sp.x : snapX(ix(p.px));
    st.sel = { x };
    renderBalloon(true);
    $('#hint').textContent = 'Clique em outro ponto, ou em ✕ para fechar';
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const p = canvasPos(e);
    const sp = nearestSpecial(p.px, p.py, 16);
    const x = ix(p.px);
    st.hover = { x, snap: sp };
    cv.style.cursor = sp ? 'pointer' : 'crosshair';
    const y = evalP(st.target, x);
    $('#hint').textContent = sp ? `Clique para ver a conta: ${fmtPt(r4(sp.x), r4(sp.y))}` : `x = ${fmt(x)}   f(x) = ${fmt(y)}`;
    $('#hint').style.fontFamily = 'var(--mono)';
    kick();
  });
  cv.addEventListener('pointerleave', () => {
    st.hover = null; $('#hint').style.fontFamily = '';
    $('#hint').textContent = st.sel ? 'Clique em outro ponto, ou em ✕ para fechar' : 'Clique em qualquer ponto do gráfico';
    kick();
  });
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    st.zoom = clamp(st.zoom * Math.exp(-e.deltaY * .0013), .35, 5); kick();
  }, { passive: false });
  $('#zIn').onclick = () => { st.zoom = clamp(st.zoom * 1.3, .35, 5); kick(); };
  $('#zOut').onclick = () => { st.zoom = clamp(st.zoom / 1.3, .35, 5); kick(); };
  $('#zReset').onclick = () => { st.zoom = 1; kick(); };
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.sel) { st.sel = null; renderBalloon(false); } });

  /* ---------- Painel lateral ---------- */
  function buildSliders() {
    const box = $('#sliders');
    box.innerHTML = '';
    COEF_INFO[st.deg].forEach((info, idx) => {
      const row = document.createElement('div');
      row.className = 'sl';
      row.innerHTML = `<b>${info.n}</b><input type="range" min="-8" max="8" step="0.5" aria-label="coeficiente ${info.n}"><output></output><small>${info.d}</small>`;
      const inp = row.querySelector('input'), out = row.querySelector('output');
      const set = () => {
        const v = Number(inp.value);
        out.textContent = fmt(v);
        inp.style.setProperty('--pct', ((v + 8) / 16 * 100) + '%');
      };
      inp.value = st.target[info.p]; set();
      inp.addEventListener('input', () => {
        let v = Number(inp.value);
        if (idx === 0 && v === 0) { v = st.target[info.p] >= 0 ? -0.5 : 0.5; inp.value = v; }
        set();
        st.target[info.p] = v;
        onCoefChange();
      });
      box.appendChild(row);
    });
  }

  function buildChips() {
    const box = $('#chips');
    box.innerHTML = '';
    if (!st.special.some((p) => p.root)) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Esta função não tem raízes reais: o gráfico não cruza o eixo x.';
      box.appendChild(e);
    }
    st.special.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'chip ' + (p.root ? 'root' : 'yint');
      b.style.animationDelay = i * 60 + 'ms';
      const name = p.root && p.yint ? 'Raiz e corte em y' : p.root ? 'Raiz' : 'Corte no eixo y';
      b.innerHTML = `<i></i><span>${name}</span><em>${fmtPt(r4(p.x), r4(p.y))}</em>`;
      b.onclick = () => { st.sel = { x: p.x }; renderBalloon(true); };
      box.appendChild(b);
    });
  }

  function buildTip() {
    const c = st.target, d = st.deg;
    let h = '';
    if (d === 1) {
      h = `Uma reta. O coeficiente angular <b>a = ${fmt(c[1])}</b> faz a reta ${c[1] > 0 ? '<b>subir</b>' : '<b>descer</b>'} da esquerda para a direita.
           O termo <b>b = ${fmt(c[0])}</b> é onde ela corta o eixo y. A raiz vem de <code>ax + b = 0</code> → <code>x = −b/a</code>.`;
    } else if (d === 2) {
      const [cc, b, a] = c, D = b * b - 4 * a * cc, xv = -b / (2 * a), yv = evalP(c, xv);
      h = `Uma parábola com concavidade <b>${a > 0 ? 'para cima' : 'para baixo'}</b>. O discriminante é
           <code>Δ = b² − 4ac = ${fmt(D)}</code>, então ${D > 1e-9 ? '<b>há 2 raízes reais</b>' : Math.abs(D) <= 1e-9 ? '<b>há 1 raiz real</b> (o vértice toca o eixo x)' : '<b>não há raízes reais</b>'}.
           O vértice fica em <code>${fmtPt(r4(xv), r4(yv))}</code>.`;
    } else {
      const n = st.special.filter((p) => p.root).length;
      h = `Uma cúbica sempre cruza o eixo x <b>pelo menos 1 vez</b> e pode ter até 3 raízes reais. Esta tem <b>${n} raiz${n > 1 ? 'es' : ''} real${n > 1 ? 'is' : ''}</b>.
           O ponto onde ela corta o eixo y é sempre <code>(0, d)</code> = <code>${fmtPt(0, r4(c[0]))}</code>.`;
    }
    $('#tip').innerHTML = h;
  }

  function refreshInfo() {
    st.special = computeSpecial(st.target, st.deg);
    $('#equation').textContent = 'f(x) = ' + symbolic(st.target, st.deg);
    buildChips();
    buildTip();
  }

  function onCoefChange() {
    refreshInfo();
    if (st.sel) renderBalloon(false);
    st.pointsT = performance.now() - 2000; // não reanimar os pontos a cada ajuste
    kick();
  }

  function setDegree(deg) {
    st.deg = deg;
    st.target = PRESETS[deg].slice();
    st.sel = null;
    renderBalloon(false);
    document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', Number(b.dataset.deg) === deg));
    $('#seg').style.setProperty('--i', deg - 1);
    buildSliders();
    refreshInfo();
    st.pointsT = performance.now();
    $('#hint').textContent = 'Clique em qualquer ponto do gráfico';
    kick();
  }

  document.querySelectorAll('#seg button').forEach((b) => b.addEventListener('click', () => {
    const d = Number(b.dataset.deg);
    if (d !== st.deg) setDegree(d);
  }));
  $('#resetBtn').onclick = () => { st.target = PRESETS[st.deg].slice(); st.sel = null; renderBalloon(false); buildSliders(); refreshInfo(); st.pointsT = performance.now(); kick(); };

  /* ---------- Tema ---------- */
  const root = document.documentElement;
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    $('#themeBtn').textContent = t === 'dark' ? '☀' : '☾';
    readColors(); kick();
  }
  $('#themeBtn').onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

  /* ---------- Início ---------- */
  setTheme(prefersLight ? 'light' : 'dark');
  $('#seg').style.setProperty('--i', 1);
  buildSliders();
  refreshInfo();
  resize();
  st.view = viewTarget();
  st.pointsT = performance.now();
  kick();
})();
</script>
</body>
</html>
