<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conjuntos Numéricos — Laboratório Matemático</title>
  <!-- Tipografia moderna com fallback instantâneo para fontes nativas -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. DESIGN TOKENS — LABORATÓRIO MATEMÁTICO MINIMALISTA
       ========================================================================= */
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-muted: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --text-primary: #0f2544;
      --text-secondary: #334e68;
      --text-muted: #64748b;

      --accent: #ff690b;
      --accent-hover: #e55a00;
      --accent-soft: #fff4ec;
      --accent-border: #ffd4b8;

      /* Paleta distinta e harmoniosa dos conjuntos */
      --N-color: #059669;
      --N-fill: #d1fae5;
      --N-lit: #a7f3d0;
      --N-bg: #ecfdf5;

      --Z-color: #7c3aed;
      --Z-fill: #ede9fe;
      --Z-lit: #ddd6fe;
      --Z-bg: #f5f3ff;

      --Q-color: #0284c7;
      --Q-fill: #e0f2fe;
      --Q-lit: #bae6fd;
      --Q-bg: #f0f9ff;

      --I-color: #db2777;
      --I-fill: #fce7f3;
      --I-lit: #fbcfe8;
      --I-bg: #fdf2f8;

      --R-color: #1d4ed8;
      --R-fill: #eff6ff;
      --R-lit: #dbeafe;
      --R-bg: #eff6ff;

      --complex-color: #6d28d9;
      --complex-bg: #f5f3ff;
      --error-color: #dc2626;
      --error-bg: #fef2f2;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 6px rgba(15, 37, 68, 0.04);
      --shadow-md: 0 8px 24px rgba(15, 37, 68, 0.06);
      --ease: 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      --font-sans: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* =========================================================================
       2. BASE E RESET
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================================
       3. CABEÇALHO COMPACTO EM UMA LINHA
       ========================================================================= */
    .lab-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1460px;
      margin: 0 auto;
      padding: 11px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff690b 0%, #ff8a3d 100%);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(255, 105, 11, 0.24);
    }

    .brand-copy {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-copy h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-copy p {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* =========================================================================
       4. LAYOUT EM DUAS COLUNAS EQUILIBRADAS (1366x768 & 1920x1080)
       ========================================================================= */
    .lab-grid {
      max-width: 1460px;
      margin: 0 auto;
      padding: 18px 22px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.14fr) minmax(0, 0.96fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* =========================================================================
       5. ÁREA ESQUERDA — SELETOR DE CONJUNTOS + DIAGRAMA SVG (SEM BOLINHA)
       ========================================================================= */
    .diagram-panel {
      padding: 16px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Barra de pills para seleção direta */
    .set-selector-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .set-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      transition: all var(--ease);
    }

    .set-pill:hover {
      border-color: var(--border-strong);
      background: var(--bg-page);
      transform: translateY(-1px);
    }

    .set-pill .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .set-pill[data-select="ALL"] .pill-dot { background: var(--text-primary); }
    .set-pill[data-select="N"] .pill-dot { background: var(--N-color); }
    .set-pill[data-select="Z"] .pill-dot { background: var(--Z-color); }
    .set-pill[data-select="Q"] .pill-dot { background: var(--Q-color); }
    .set-pill[data-select="I"] .pill-dot { background: var(--I-color); }
    .set-pill[data-select="R"] .pill-dot { background: var(--R-color); }

    /* Estados ativos das pills */
    .set-pill.active[data-select="ALL"] {
      background: var(--text-primary);
      border-color: var(--text-primary);
      color: #ffffff;
    }
    .set-pill.active[data-select="ALL"] .pill-dot { background: #ffffff; }

    .set-pill.active[data-select="N"] {
      background: var(--N-color);
      border-color: var(--N-color);
      color: #ffffff;
    }
    .set-pill.active[data-select="Z"] {
      background: var(--Z-color);
      border-color: var(--Z-color);
      color: #ffffff;
    }
    .set-pill.active[data-select="Q"] {
      background: var(--Q-color);
      border-color: var(--Q-color);
      color: #ffffff;
    }
    .set-pill.active[data-select="I"] {
      background: var(--I-color);
      border-color: var(--I-color);
      color: #ffffff;
    }
    .set-pill.active[data-select="R"] {
      background: var(--R-color);
      border-color: var(--R-color);
      color: #ffffff;
    }
    .set-pill.active .pill-dot {
      background: #ffffff;
    }

    /* Palco do diagrama SVG */
    .diagram-canvas {
      position: relative;
      width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #fcfdff;
      overflow: hidden;
    }

    #setsSvg {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Regiões interativas do SVG */
    .svg-region {
      cursor: pointer;
      outline: none;
    }

    .svg-region .region-shape {
      transition: fill 0.3s ease, stroke 0.3s ease, stroke-width 0.25s ease, filter 0.3s ease;
    }

    .svg-region text {
      font-family: var(--font-sans);
      pointer-events: none;
      transition: fill 0.3s ease, opacity 0.3s ease;
    }

    .svg-title {
      font-weight: 800;
    }

    .svg-sub {
      font-weight: 700;
    }

    .svg-ex {
      font-size: 12.5px;
      font-weight: 700;
    }

    .svg-region:hover .region-shape {
      stroke-width: 3.2px;
      filter: drop-shadow(0 0 8px rgba(15, 37, 68, 0.14));
    }

    /* Estado ACESO (conjunto pertencente / relacionado na hierarquia) */
    .svg-region.is-lit .region-shape {
      stroke-width: 3px;
      stroke-dasharray: none;
      filter: drop-shadow(0 0 8px rgba(15, 37, 68, 0.11));
    }

    .svg-region.is-lit[data-set="N"] .region-shape { fill: var(--N-lit); stroke: #047857; }
    .svg-region.is-lit[data-set="Z"] .region-shape { fill: var(--Z-lit); stroke: #6d28d9; }
    .svg-region.is-lit[data-set="Q"] .region-shape { fill: var(--Q-lit); stroke: #0369a1; }
    .svg-region.is-lit[data-set="I"] .region-shape { fill: var(--I-lit); stroke: #be185d; }
    .svg-region.is-lit[data-set="R"] .region-shape { fill: var(--R-lit); stroke: #1d4ed8; }

    /* Destaque extra no conjunto foco (mais específico) */
    .svg-region.is-primary .region-shape {
      stroke-width: 3.8px;
      filter: drop-shadow(0 0 11px rgba(15, 37, 68, 0.18));
    }

    /* Estado APAGADO / NEUTRO (não relacionado na hierarquia ou não pertencente) */
    .svg-region.is-dimmed .region-shape {
      fill: #f1f5f9 !important;
      stroke: #cbd5e1 !important;
      stroke-width: 1.6px !important;
      stroke-dasharray: 5 4;
      filter: none;
    }

    .svg-region.is-dimmed text {
      fill: #94a3b8 !important;
      opacity: 0.65;
    }

    .svg-region.is-dimmed:hover .region-shape {
      fill: #e2e8f0 !important;
      stroke: #94a3b8 !important;
    }

    /* Faixa discreta e limpa abaixo do diagrama */
    .diagram-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-page);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      color: var(--text-secondary);
      transition: background var(--ease), border-color var(--ease);
    }

    .diagram-status-bar.status-outside {
      background: var(--complex-bg);
      border-color: #ddd6fe;
      color: var(--complex-color);
    }

    .diagram-status-bar.status-error {
      background: var(--error-bg);
      border-color: #fecaca;
      color: var(--error-color);
    }

    .status-main {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .status-relation-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-weight: 800;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .status-relation-tag.accent {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-hover);
    }

    .status-text {
      font-weight: 600;
    }

    /* =========================================================================
       6. ÁREA DIREITA — DISPLAY ANALISADOR + RESUMO + 3 ABAS LIMPAS
       ========================================================================= */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .input-panel {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .input-box {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    #exprInput {
      width: 100%;
      padding: 12px 38px 12px 14px;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--bg-page);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      transition: all var(--ease);
    }

    #exprInput::placeholder {
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.94rem;
    }

    #exprInput:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 105, 11, 0.13);
    }

    .clear-x-btn {
      position: absolute;
      right: 10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: #e2e8f0;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--ease);
    }

    .clear-x-btn:hover {
      background: #cbd5e1;
      color: var(--text-primary);
    }

    .btn-analyze {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0 22px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 12px rgba(255, 105, 11, 0.25);
      transition: all var(--ease);
      white-space: nowrap;
    }

    .btn-analyze:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 105, 11, 0.32);
    }

    .btn-analyze:active {
      transform: translateY(0);
    }

    /* Linhas compactas de atalhos de símbolos e exemplos */
    .compact-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .row-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-right: 3px;
    }

    .sym-btn {
      min-width: 30px;
      height: 28px;
      padding: 0 8px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-page);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--ease);
    }

    .sym-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-hover);
    }

    .quick-ex {
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      transition: all var(--ease);
    }

    .quick-ex:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    /* =========================================================================
       7. CARD DE RESUMO + ABAS DO PAINEL DIREITO
       ========================================================================= */
    .analysis-panel {
      display: flex;
      flex-direction: column;
    }

    /* Resumo limpo e objetivo */
    .summary-area {
      padding: 15px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
      animation: softFade 0.22s ease;
    }

    @keyframes softFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 11px;
    }

    .summary-value-group {
      min-width: 0;
    }

    .summary-expr {
      font-size: 1.24rem;
      font-weight: 800;
      color: var(--text-primary);
      word-break: break-word;
      line-height: 1.25;
    }

    .summary-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .primary-badge {
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bg-N { background: var(--N-color); }
    .bg-Z { background: var(--Z-color); }
    .bg-Q { background: var(--Q-color); }
    .bg-I { background: var(--I-color); }
    .bg-R { background: var(--R-color); }
    .bg-C { background: var(--complex-color); }
    .bg-ERR { background: var(--error-color); }

    /* 5 pílulas compactas de pertencimento (∈ / ∉) */
    .membership-pills {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .m-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      border-radius: 9px;
      font-size: 0.83rem;
      font-weight: 800;
      border: 1.5px solid var(--border);
      background: var(--bg-page);
      color: #94a3b8;
      transition: all var(--ease);
    }

    .m-pill.in[data-set="N"] { background: var(--N-bg); border-color: rgba(5, 150, 105, 0.4); color: #065f46; }
    .m-pill.in[data-set="Z"] { background: var(--Z-bg); border-color: rgba(124, 58, 237, 0.4); color: #5b21b6; }
    .m-pill.in[data-set="Q"] { background: var(--Q-bg); border-color: rgba(2, 132, 199, 0.4); color: #075985; }
    .m-pill.in[data-set="I"] { background: var(--I-bg); border-color: rgba(219, 39, 119, 0.4); color: #9d174d; }
    .m-pill.in[data-set="R"] { background: var(--R-bg); border-color: rgba(29, 78, 216, 0.4); color: #1e3a8a; }

    /* Navegação das 3 Abas Limpas */
    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
      background: var(--bg-page);
      padding: 0 10px;
      gap: 4px;
    }

    .tab-btn {
      position: relative;
      background: transparent;
      border: none;
      padding: 11px 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: color var(--ease);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--accent);
      font-weight: 800;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 2.5px;
      border-radius: 3px 3px 0 0;
      background: var(--accent);
    }

    /* Corpo das abas */
    .tab-content {
      padding: 16px 18px 18px;
      min-height: 300px;
    }

    .tab-pane {
      display: none;
      animation: softFade 0.2s ease;
    }

    .tab-pane.active {
      display: block;
    }

    /* Aba 1: Lista objetiva de pertencimento + Entenda a classificação */
    .detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }

    .detail-item {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.42;
    }

    .detail-item.is-in {
      background: #f8fffe;
      border-color: rgba(5, 150, 105, 0.22);
    }

    .detail-sym {
      font-weight: 800;
      font-size: 0.82rem;
      min-width: 44px;
      flex-shrink: 0;
    }

    .detail-item.is-in .detail-sym { color: var(--N-color); }
    .detail-item.is-out .detail-sym { color: #94a3b8; }

    .explain-box {
      padding: 13px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-page);
      border: 1px solid var(--border);
    }

    .explain-title {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explain-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .steps-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 10px;
    }

    .steps-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .step-idx {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-size: 0.72rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .explain-conclusion {
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      border-left: 3.5px solid var(--accent);
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .alert-banner {
      padding: 11px 13px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .alert-banner.complex {
      background: var(--complex-bg);
      border: 1px solid #ddd6fe;
      color: #4c1d95;
    }

    .alert-banner.error {
      background: var(--error-bg);
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    /* Aba 2: Detalhes do Conjunto Selecionado */
    .set-info-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .set-info-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .set-info-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .set-info-head h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .set-info-head p {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .set-info-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .meta-tile {
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      background: var(--bg-page);
      border: 1px solid var(--border);
    }

    .meta-tile small {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .meta-tile span {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .set-info-desc {
      font-size: 0.89rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .set-info-examples {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-top: 4px;
    }

    /* Aba 3: Histórico & Glossário */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-head h4 {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .btn-clear-hist {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all var(--ease);
    }

    .btn-clear-hist:hover {
      border-color: #fca5a5;
      color: var(--error-color);
      background: var(--error-bg);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 170px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 2px;
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #ffffff;
      text-align: left;
      transition: all var(--ease);
    }

    .history-row:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .history-expr {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-tag {
      font-size: 0.71rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .empty-msg {
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-page);
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .glossary-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .glossary-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-page);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--ease);
    }

    .glossary-row:hover {
      border-color: var(--border-strong);
      background: #ffffff;
    }

    .g-badge {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .glossary-row div {
      font-size: 0.81rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .glossary-row strong {
      color: var(--text-primary);
    }

    /* =========================================================================
       8. RESPONSIVIDADE (1366x768, TABLETS E TELAS MENORES)
       ========================================================================= */
    @media (max-width: 1280px) {
      .lab-grid {
        padding: 14px 16px 24px;
        gap: 14px;
      }
      .header-inner {
        padding: 10px 16px;
      }
    }

    @media (max-width: 1024px) {
      .lab-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .brand-copy {
        gap: 2px;
        flex-direction: column;
      }
      .input-row {
        flex-direction: column;
      }
      .btn-analyze {
        height: 42px;
        width: 100%;
      }
      .set-info-meta {
        grid-template-columns: 1fr;
      }
      .diagram-panel, .input-panel, .summary-area, .tab-content {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- =======================================================================
       CABEÇALHO COMPACTO EM UMA LINHA
       ======================================================================= -->
  <header class="lab-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="2.5" y="3.5" width="19" height="17" rx="5" stroke="currentColor" stroke-width="2.1" />
            <circle cx="9.8" cy="12" r="4.3" stroke="currentColor" stroke-width="1.9" />
            <circle cx="9.8" cy="12" r="1.7" fill="currentColor" />
            <rect x="16" y="7.5" width="3" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </div>
        <div class="brand-copy">
          <h1>Conjuntos Numéricos</h1>
          <p>Explore, classifique e compreenda os números</p>
        </div>
      </div>
    </div>
  </header>

  <!-- =======================================================================
       LABORATÓRIO EM DUAS COLUNAS EQUILIBRADAS
       ======================================================================= -->
  <main class="lab-grid">
    <!-- =====================================================================
         ÁREA ESQUERDA: SELETOR DE CONJUNTOS + DIAGRAMA INTERATIVO SVG
         ===================================================================== -->
    <section class="panel diagram-panel" aria-label="Diagrama interativo dos conjuntos numéricos">
      <!-- Barra limpa de seleção direta dos conjuntos -->
      <div class="set-selector-bar" role="group" aria-label="Selecionar conjunto numérico">
        <button type="button" class="set-pill active" data-select="ALL"><span class="pill-dot"></span>Todos</button>
        <button type="button" class="set-pill" data-select="N"><span class="pill-dot"></span>ℕ Naturais</button>
        <button type="button" class="set-pill" data-select="Z"><span class="pill-dot"></span>ℤ Inteiros</button>
        <button type="button" class="set-pill" data-select="Q"><span class="pill-dot"></span>ℚ Racionais</button>
        <button type="button" class="set-pill" data-select="I"><span class="pill-dot"></span>𝕀 Irracionais</button>
        <button type="button" class="set-pill" data-select="R"><span class="pill-dot"></span>ℝ Reais</button>
      </div>

      <!-- Diagrama SVG rigoroso: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ e 𝕀 ⊂ ℝ com 𝕀 ∩ ℚ = ∅ (sem bolinhas) -->
      <div class="diagram-canvas">
        <svg id="setsSvg" viewBox="0 0 700 420" role="img" aria-label="Diagrama de inclusão dos conjuntos numéricos Reais, Racionais, Inteiros, Naturais e Irracionais">
          <defs>
            <pattern id="labGrid" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(15, 37, 68, 0.045)" stroke-width="1" />
            </pattern>
          </defs>

          <!-- Grade discreta de laboratório -->
          <rect x="0" y="0" width="700" height="420" fill="url(#labGrid)" />

          <!-- REAIS (ℝ): envolve Racionais (ℚ) e Irracionais (𝕀) -->
          <g class="svg-region" data-set="R" tabindex="0" role="button" aria-label="Conjunto dos Números Reais">
            <rect class="region-shape" x="14" y="14" width="672" height="392" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2" />
            <text class="svg-title" x="34" y="42" fill="#1e3a8a" font-size="16.5">ℝ — Reais</text>
            <text class="svg-sub" x="668" y="41" fill="#3b82f6" font-size="11.5" text-anchor="end">ℝ = ℚ ∪ 𝕀</text>
          </g>

          <!-- RACIONAIS (ℚ): região esquerda/central dentro de ℝ -->
          <g class="svg-region" data-set="Q" tabindex="0" role="button" aria-label="Conjunto dos Números Racionais">
            <rect class="region-shape" x="32" y="58" width="442" height="330" rx="108" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2" />
            <text class="svg-title" x="114" y="90" fill="#075985" font-size="15.5">ℚ — Racionais</text>
            <text class="svg-sub" x="114" y="107" fill="#0284c7" font-size="11">Frações, decimais exatos e dízimas</text>
            <text class="svg-ex" x="76" y="146" fill="#075985">1/2</text>
            <text class="svg-ex" x="404" y="108" fill="#075985" text-anchor="middle">2,5</text>
            <text class="svg-ex" x="427" y="216" fill="#075985" text-anchor="middle">0,333...</text>
            <text class="svg-ex" x="421" y="298" fill="#075985" text-anchor="middle">-7/4</text>
          </g>

          <!-- INTEIROS (ℤ): totalmente contido em ℚ -->
          <g class="svg-region" data-set="Z" tabindex="0" role="button" aria-label="Conjunto dos Números Inteiros">
            <rect class="region-shape" x="62" y="140" width="322" height="226" rx="82" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2" />
            <text class="svg-title" x="128" y="170" fill="#5b21b6" font-size="15">ℤ — Inteiros</text>
            <text class="svg-sub" x="128" y="186" fill="#7c3aed" font-size="10.8">Naturais e negativos</text>
            <text class="svg-ex" x="88" y="250" fill="#5b21b6">-1</text>
            <text class="svg-ex" x="88" y="302" fill="#5b21b6">-8</text>
            <text class="svg-ex" x="348" y="290" fill="#5b21b6" text-anchor="middle">-42</text>
          </g>

          <!-- NATURAIS (ℕ): totalmente contido em ℤ -->
          <g class="svg-region" data-set="N" tabindex="0" role="button" aria-label="Conjunto dos Números Naturais">
            <rect class="region-shape" x="124" y="212" width="194" height="132" rx="56" fill="#d1fae5" stroke="#059669" stroke-width="2.2" />
            <text class="svg-title" x="221" y="248" fill="#065f46" font-size="15" text-anchor="middle">ℕ — Naturais</text>
            <text class="svg-sub" x="221" y="266" fill="#059669" font-size="10.8" text-anchor="middle">Inteiros ≥ 0</text>
            <text class="svg-ex" x="162" y="314" fill="#065f46" text-anchor="middle">0</text>
            <text class="svg-ex" x="200" y="314" fill="#065f46" text-anchor="middle">1</text>
            <text class="svg-ex" x="238" y="314" fill="#065f46" text-anchor="middle">5</text>
            <text class="svg-ex" x="280" y="314" fill="#065f46" text-anchor="middle">12</text>
          </g>

          <!-- Separador visual da disjunção 𝕀 ∩ ℚ = ∅ -->
          <g aria-hidden="true">
            <line x1="491" y1="68" x2="491" y2="378" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5" />
            <rect x="461" y="352" width="60" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" />
            <text x="491" y="365.5" text-anchor="middle" font-family="Nunito Sans, sans-serif" font-size="10" font-weight="800" fill="#64748b">𝕀 ∩ ℚ = ∅</text>
          </g>

          <!-- IRRACIONAIS (𝕀): totalmente separado de ℚ, dentro de ℝ -->
          <g class="svg-region" data-set="I" tabindex="0" role="button" aria-label="Conjunto dos Números Irracionais">
            <rect class="region-shape" x="508" y="58" width="160" height="330" rx="48" fill="#fce7f3" stroke="#db2777" stroke-width="2.2" />
            <text class="svg-title" x="588" y="100" fill="#9d174d" font-size="15.5" text-anchor="middle">𝕀 — Irracionais</text>
            <text class="svg-sub" x="588" y="120" fill="#db2777" font-size="10.8" text-anchor="middle">Infinitos e</text>
            <text class="svg-sub" x="588" y="134" fill="#db2777" font-size="10.8" text-anchor="middle">não periódicos</text>
            <text class="svg-ex" x="554" y="226" fill="#9d174d" text-anchor="middle">π</text>
            <text class="svg-ex" x="622" y="226" fill="#9d174d" text-anchor="middle">√2</text>
            <text class="svg-ex" x="554" y="286" fill="#9d174d" text-anchor="middle">e</text>
            <text class="svg-ex" x="622" y="286" fill="#9d174d" text-anchor="middle">φ</text>
            <text class="svg-ex" x="588" y="340" fill="#9d174d" text-anchor="middle">√3</text>
          </g>
        </svg>
      </div>

      <!-- Faixa discreta da relação ativa / resultado no diagrama -->
      <div class="diagram-status-bar" id="diagramStatusBar" aria-live="polite">
        <div class="status-main">
          <span class="status-relation-tag" id="diagramRelationTag">ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ  |  𝕀 ⊂ ℝ</span>
          <span class="status-text" id="diagramStatusText">Selecione um conjunto acima ou clique no diagrama para destacar sua hierarquia.</span>
        </div>
      </div>
    </section>

    <!-- =====================================================================
         ÁREA DIREITA: DISPLAY ANALISADOR + RESUMO + 3 ABAS LIMPAS
         ===================================================================== -->
    <section class="right-column" aria-label="Verificador inteligente e explicações">
      <!-- Painel de Entrada -->
      <div class="panel input-panel">
        <form id="analyzerForm" novalidate>
          <div class="input-row">
            <div class="input-box">
              <input
                type="text"
                id="exprInput"
                autocomplete="off"
                spellcheck="false"
                placeholder="Digite um número, fração, raiz, expressão ou letra (ex.: 2,5, √2, 2x)"
                aria-label="Expressão matemática para analisar"
              />
              <button type="button" class="clear-x-btn" id="clearInputBtn" title="Limpar campo" aria-label="Limpar campo">×</button>
            </div>
            <button type="submit" class="btn-analyze">Analisar</button>
          </div>
        </form>

        <!-- Linha compacta de símbolos -->
        <div class="compact-row" role="toolbar" aria-label="Atalhos de símbolos matemáticos">
          <span class="row-label">Símbolos</span>
          <button type="button" class="sym-btn" data-insert="√" title="Raiz quadrada">√</button>
          <button type="button" class="sym-btn" data-insert="∛" title="Raiz cúbica">∛</button>
          <button type="button" class="sym-btn" data-insert="π" title="Pi">π</button>
          <button type="button" class="sym-btn" data-insert="e" title="Número de Euler">e</button>
          <button type="button" class="sym-btn" data-insert="φ" title="Razão Áurea (Phi)">φ</button>
          <button type="button" class="sym-btn" data-insert="/" title="Fração / Divisão">/</button>
          <button type="button" class="sym-btn" data-insert="^" title="Potência">^</button>
          <button type="button" class="sym-btn" data-insert="," title="Vírgula decimal">,</button>
          <button type="button" class="sym-btn" data-insert="..." title="Dízima periódica">...</button>
        </div>

        <!-- Linha compacta de exemplos rápidos -->
        <div class="compact-row" aria-label="Exemplos rápidos">
          <span class="row-label">Exemplos</span>
          <button type="button" class="quick-ex" data-expr="7">7</button>
          <button type="button" class="quick-ex" data-expr="-3">-3</button>
          <button type="button" class="quick-ex" data-expr="3/4">3/4</button>
          <button type="button" class="quick-ex" data-expr="2,5">2,5</button>
          <button type="button" class="quick-ex" data-expr="0,333...">0,333...</button>
          <button type="button" class="quick-ex" data-expr="√2">√2</button>
          <button type="button" class="quick-ex" data-expr="√16">√16</button>
          <button type="button" class="quick-ex" data-expr="π">π</button>
          <button type="button" class="quick-ex" data-expr="x">x</button>
          <button type="button" class="quick-ex" data-expr="√(-4)">√(-4)</button>
          <button type="button" class="quick-ex" data-expr="5/0">5/0</button>
        </div>
      </div>

      <!-- Painel de Resumo + 3 Abas Limpas -->
      <div class="panel analysis-panel">
        <!-- Resumo do Resultado (sempre visível e objetivo) -->
        <div class="summary-area" id="summaryArea" aria-live="polite">
          <div class="summary-top">
            <div class="summary-value-group">
              <div class="summary-expr" id="summaryExpr">—</div>
              <div class="summary-sub" id="summarySub">Digite uma expressão acima para classificar</div>
            </div>
            <span class="primary-badge bg-Q" id="summaryBadge">PRONTO</span>
          </div>

          <!-- 5 pílulas compactas de pertencimento ∈ / ∉ -->
          <div class="membership-pills" id="membershipPills" aria-label="Pertencimento aos conjuntos numéricos">
            <div class="m-pill" data-set="N">∉ ℕ</div>
            <div class="m-pill" data-set="Z">∉ ℤ</div>
            <div class="m-pill" data-set="Q">∉ ℚ</div>
            <div class="m-pill" data-set="I">∉ 𝕀</div>
            <div class="m-pill" data-set="R">∉ ℝ</div>
          </div>
        </div>

        <!-- Sistema de 3 Abas -->
        <nav class="tabs-nav" role="tablist" aria-label="Detalhes da análise">
          <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="analysis">Análise</button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="set">Conjunto</button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="history">Histórico &amp; Glossário</button>
        </nav>

        <!-- Conteúdo das 3 Abas -->
        <div class="tab-content">
          <!-- Aba 1: Análise + Entenda a classificação -->
          <div class="tab-pane active" id="tab-analysis" role="tabpanel"></div>

          <!-- Aba 2: Conjunto Selecionado -->
          <div class="tab-pane" id="tab-set" role="tabpanel"></div>

          <!-- Aba 3: Histórico & Glossário -->
          <div class="tab-pane" id="tab-history" role="tabpanel">
            <div class="section-head">
              <h4>Últimas Análises</h4>
              <button type="button" class="btn-clear-hist" id="clearHistoryBtn">Limpar histórico</button>
            </div>
            <div id="historyContainer"></div>

            <div class="section-head">
              <h4>Glossário Resumido</h4>
            </div>
            <div class="glossary-list" id="glossaryList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      /* =======================================================================
         1. METADADOS DIDÁTICOS E HIERARQUIA DE INCLUSÃO DOS CONJUNTOS
         ======================================================================= */
      const SET_ORDER = ['N', 'Z', 'Q', 'I', 'R'];

      // Conjuntos que ficam acesos (coloridos) quando o usuário seleciona cada opção
      const INCLUSION_MAP = {
        ALL: ['N', 'Z', 'Q', 'I', 'R'],
        N: ['N', 'Z', 'Q', 'R'],
        Z: ['Z', 'Q', 'R'],
        Q: ['Q', 'R'],
        I: ['I', 'R'],
        R: ['N', 'Z', 'Q', 'I', 'R']
      };

      const SET_INFO = {
        N: {
          code: 'N',
          symbol: 'ℕ',
          name: 'Números Naturais',
          badge: 'NATURAL (ℕ)',
          color: '#059669',
          notation: 'ℕ = {0, 1, 2, 3, 4, ...}',
          relation: 'ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ',
          statusLine: 'Todo número natural pertence aos Naturais, Inteiros, Racionais e Reais.',
          definition: 'Reúne os números inteiros não negativos usados para contagem e ordenação. Pela inclusão hierárquica, todo natural também é inteiro, racional e real.',
          shortGloss: 'Inteiros não negativos (0, 1, 2, 3...). Todo natural é inteiro, racional e real.',
          examples: ['0', '7', '√16', '10/2', '0,5 + 0,5', '∛8']
        },
        Z: {
          code: 'Z',
          symbol: 'ℤ',
          name: 'Números Inteiros',
          badge: 'INTEIRO (ℤ)',
          color: '#7c3aed',
          notation: 'ℤ = {..., -3, -2, -1, 0, 1, 2, 3, ...}',
          relation: 'ℤ ⊂ ℚ ⊂ ℝ',
          statusLine: 'Todo número inteiro pertence aos Inteiros, Racionais e Reais.',

        },
        Q: {

          statusLine: 'Todo número racional pertence aos Racionais e aos Reais (e nunca aos Irracionais).',
          definition: 'Qualquer número que pode ser expresso como fração entre dois inteiros com denominador diferente de zero. Inclui inteiros, frações, decimais exatos e dízimas periódicas.',
          shortGloss: 'Expressáveis como fração p/q (q ≠ 0): inteiros, decimais exatos e dízimas periódicas.',
          examples: ['3/4', '2,5', '-7/4', '0,333...', '0,1(6)', '1,2323...']

        I: {

          notation: '𝕀 = ℝ \\ ℚ  (𝕀 ∩ ℚ = ∅)',
          relation: '𝕀 ⊂ ℝ  |  𝕀 ∩ ℚ = ∅',
          statusLine: 'Todo número irracional pertence aos Irracionais e aos Reais, sem interseção com os Racionais.',
          definition: 'Números reais que não podem ser representados como fração de dois inteiros. Possuem representação decimal infinita e não periódica, como raízes não exatas e constantes irracionais.',
          shortGloss: 'Reais com expansão decimal infinita e não periódica (π, e, φ, √2, ∛2). Disjunto de ℚ.',
