          statusLine: 'Os Reais reúnem todos os Racionais (ℕ, ℤ, ℚ) e todos os Irracionais (𝕀) na reta numérica.',
          definition: 'União completa dos conjuntos dos Racionais (ℚ) e Irracionais (𝕀). Raízes de índice par de números negativos ficam fora de ℝ (pertencem aos Complexos ℂ).',
          shortGloss: 'União de Racionais e Irracionais (ℝ = ℚ ∪ 𝕀). Preenche toda a reta numérica.',
          examples: ['7', '-3', '2,5', '0,333...', '√2', 'π']
        }
      };

      // Constantes irracionais conhecidas e seus valores aproximados
      const KNOWN_CONSTANTS = {
        'π': { name: 'π (Pi)', approx: Math.PI, desc: 'a constante irracional π (razão entre perímetro e diâmetro da circunferência)' },
        'e': { name: 'e (Número de Euler)', approx: Math.E, desc: 'a constante irracional e (base dos logaritmos naturais)' },
        'φ': { name: 'φ (Razão Áurea)', approx: (1 + Math.sqrt(5)) / 2, desc: 'a constante irracional φ (razão áurea, (1 + √5)/2)' },
        'τ': { name: 'τ (Tau = 2π)', approx: 2 * Math.PI, desc: 'a constante irracional τ (equivalente a 2π)' }
      };

      /* =======================================================================
         2. MOTOR MATEMÁTICO SIMBÓLICO EXATO (BigInt, SEM eval())
            + SUPORTE A RAÍZES CÚBICAS, CONSTANTES E REGRA DE LETRAS = IRRACIONAL
         ======================================================================= */

      class MathSyntaxError extends Error {
        constructor(msg) { super(msg); this.name = 'MathSyntaxError'; }
      }
      class DivisionByZeroError extends Error {
        constructor(msg) { super(msg); this.name = 'DivisionByZeroError'; }
      }
      class ComplexNumberError extends Error {
        constructor(msg, detail = '') {
          super(msg);
          this.name = 'ComplexNumberError';
          this.detail = detail;
        }
      }

      /** Operações inteiras exatas com BigInt */
      const BigMath = {
        abs(n) { return n < 0n ? -n : n; },

        gcd(a, b) {
          a = this.abs(a);
          b = this.abs(b);
          while (b !== 0n) {
            const t = a % b;
            a = b;
            b = t;
          }
          return a === 0n ? 1n : a;
        },

        isqrt(n) {
          if (n < 0n) throw new ComplexNumberError('Raiz quadrada de número negativo não pertence aos Reais (ℝ).');
          if (n < 2n) return n;
          let x0 = 1n << BigInt((n.toString(2).length + 1) >> 1);
          let x1 = (x0 + n / x0) >> 1n;
          while (x1 < x0) {
            x0 = x1;
            x1 = (x0 + n / x0) >> 1n;
          }
          return x0;
        },

        exactNthRoot(value, n) {
          if (n <= 0) return null;
          if (value === 0n) return 0n;
          if (value === 1n) return 1n;
          if (value < 0n) {
            if (n % 2 === 0) return null;
            const pos = this.exactNthRoot(-value, n);
            return pos === null ? null : -pos;
          }
          if (n === 1) return value;
          if (n === 2) {
            const r = this.isqrt(value);
            return r * r === value ? r : null;
          }
          let low = 1n;
          let high = 1n << BigInt(Math.ceil(value.toString(2).length / n) + 1);
          const bn = BigInt(n);
          while (low <= high) {
            const mid = (low + high) >> 1n;
            const p = mid ** bn;
            if (p === value) return mid;
            if (p < value) low = mid + 1n;
            else high = mid - 1n;
          }
          return null;
        },

        splitSquareFree(n) {
          if (n === 0n) return { square: 0n, free: 1n };
          const root = this.isqrt(n);
          if (root * root === n) return { square: root, free: 1n };
          if (n > 10000000000000000n) return { square: 1n, free: n };

          let square = 1n;
          let rem = n;
          while (rem % 4n === 0n) {
            square *= 2n;
            rem /= 4n;
          }
          let d = 3n;
          const maxTrial = 100000n;
          while (d * d <= rem && d <= maxTrial) {
            const sq = d * d;
            while (rem % sq === 0n) {
              square *= d;
              rem /= sq;
            }
            d += 2n;
          }
          const remRoot = this.isqrt(rem);
          if (remRoot > 1n && remRoot * remRoot === rem) {
            square *= remRoot;
            rem = 1n;
          }
          return { square, free: rem };
        }
      };

      /** Fração Racional Exata (p/q) usando BigInt */
      class Rat {
        constructor(n, d = 1n) {
          if (d === 0n) throw new DivisionByZeroError('Divisão por zero não é definida na matemática.');
          if (d < 0n) { n = -n; d = -d; }
          if (n === 0n) {
            this.n = 0n;
            this.d = 1n;
          } else {
            const g = BigMath.gcd(n, d);
            this.n = n / g;
            this.d = d / g;
          }
        }

        static zero() { return new Rat(0n, 1n); }
        static one() { return new Rat(1n, 1n); }

        isZero() { return this.n === 0n; }
        isOne() { return this.n === 1n && this.d === 1n; }
        isNeg() { return this.n < 0n; }
        isInt() { return this.d === 1n; }

        neg() { return new Rat(-this.n, this.d); }
        abs() { return new Rat(BigMath.abs(this.n), this.d); }

        add(o) { return new Rat(this.n * o.d + o.n * this.d, this.d * o.d); }
        sub(o) { return new Rat(this.n * o.d - o.n * this.d, this.d * o.d); }
        mul(o) { return new Rat(this.n * o.n, this.d * o.d); }
        div(o) {
          if (o.isZero()) throw new DivisionByZeroError('Divisão por zero não é definida na matemática.');
          return new Rat(this.n * o.d, this.d * o.n);
        }

        powInt(exp) {
          if (Math.abs(exp) > 120) {
            throw new MathSyntaxError('Expoente muito elevado para cálculo exato (use até ±120).');
          }
          if (exp === 0) {
            if (this.isZero()) throw new DivisionByZeroError('A expressão 0^0 é uma forma indeterminada.');
            return Rat.one();
          }
          const e = BigInt(Math.abs(exp));
          if (exp > 0) return new Rat(this.n ** e, this.d ** e);
          if (this.isZero()) throw new DivisionByZeroError('Zero elevado a expoente negativo equivale a divisão por zero.');
          return new Rat(this.d ** e, this.n ** e);
        }

        toNumber() {
          const nStr = this.n.toString();
          const dStr = this.d.toString();
          if (nStr.length < 16 && dStr.length < 16) return Number(this.n) / Number(this.d);
          const shift = Math.max(nStr.length, dStr.length) - 15;
          const factor = 10n ** BigInt(Math.max(0, shift));
          return Number(this.n / factor) / Number(this.d / factor);
        }

        hasTerminatingDecimal() {
          let d = this.d;
          while (d % 2n === 0n) d /= 2n;
          while (d % 5n === 0n) d /= 5n;
          return d === 1n;
        }

        toExactDecimalBR(maxDigits = 10) {
          if (this.d === 1n) return this.n.toString();
          if (!this.hasTerminatingDecimal()) return null;
          let d = this.d;
          let twos = 0, fives = 0;
          while (d % 2n === 0n) { d /= 2n; twos++; }
          while (d % 5n === 0n) { d /= 5n; fives++; }
          const k = Math.max(twos, fives);
          if (k > maxDigits) return null;

          const sign = this.n < 0n ? '-' : '';
          const scale = (2n ** BigInt(k - twos)) * (5n ** BigInt(k - fives));
          const scaled = BigMath.abs(this.n) * scale;
          const str = scaled.toString().padStart(k + 1, '0');
          const intPart = str.slice(0, str.length - k);
          const fracPart = str.slice(str.length - k).replace(/0+$/, '');
          return fracPart ? `${sign}${intPart},${fracPart}` : `${sign}${intPart}`;
        }

        toString() {
          return this.d === 1n ? this.n.toString() : `${this.n.toString()}/${this.d.toString()}`;
        }
      }

      /**
       * Valor Simbólico Exato:
       * Combinação linear de termos: coef * √(rad) * ∏(sym^exp)
       * Suporta cancelamento algébrico exato (π - π = 0, x - x = 0, 0 * x = 0, x / x = 1, √2 * √2 = 2)
       * e encapsulamento seguro para irracionais compostos (∛2, 1/(x+1), √x, etc.).
       */
      class SymVal {
        constructor(termsMap = null, opaque = null) {
          this.opaque = opaque; // null ou { display, approx, symbols: Set<string>, hasRad: boolean, note: string }
          this.terms = new Map();
          if (termsMap && !opaque) {
            for (const [k, t] of termsMap.entries()) {
              if (!t.coef.isZero()) this.terms.set(k, t);
            }
          }
        }

        static normalizeVars(varsObj) {
          const clean = {};
          const keys = Object.keys(varsObj || {}).sort();
          for (const k of keys) {
            if (varsObj[k] !== 0) clean[k] = varsObj[k];
          }
          return clean;
        }

        static keyOf(rad, varsObj) {
          const clean = SymVal.normalizeVars(varsObj);
          const vPart = Object.keys(clean).map((k) => `${k}^${clean[k]}`).join('*');
          return `${rad.toString()}|${vPart}`;
        }

        static fromRat(rat) {
          const sv = new SymVal();
          if (!rat.isZero()) {
            sv.terms.set('1|', { coef: rat, rad: 1n, vars: {} });
          }
          return sv;
        }

        static fromSymbol(symName) {
          const vars = { [symName]: 1 };
          return new SymVal(new Map([
            [SymVal.keyOf(1n, vars), { coef: Rat.one(), rad: 1n, vars }]
          ]));
        }

        static fromOpaque(display, approx, symbols, hasRad = false, note = '') {
          return new SymVal(null, {
            display,
            approx: Number.isFinite(approx) ? approx : null,
            symbols: new Set(symbols || []),
            hasRad,
            note
          });
        }

        isZero() { return !this.opaque && this.terms.size === 0; }

        isRational() {
          if (this.opaque) return false;
          if (this.terms.size === 0) return true;
          return this.terms.size === 1 && this.terms.has('1|');
        }

        asRat() {
          if (!this.isRational()) return null;
          return this.terms.size === 0 ? Rat.zero() : this.terms.get('1|').coef;
        }

        collectSymbols() {
          const set = new Set();
          if (this.opaque) {
            this.opaque.symbols.forEach((s) => set.add(s));
            return set;
          }
          for (const t of this.terms.values()) {
            Object.keys(t.vars).forEach((s) => set.add(s));
          }
          return set;
        }

        hasRadicals() {
          if (this.opaque) return this.opaque.hasRad;
          for (const t of this.terms.values()) {
            if (t.rad > 1n) return true;
          }
          return false;
        }

        hasGenericLetters() {
          for (const s of this.collectSymbols()) {
            if (!KNOWN_CONSTANTS[s]) return true;
          }
          return false;
        }

        toApprox() {
          if (this.opaque) return this.opaque.approx;
          if (this.hasGenericLetters()) return null;
          let sum = 0;
          for (const t of this.terms.values()) {
            let v = t.coef.toNumber() * (t.rad === 1n ? 1 : Math.sqrt(Number(t.rad)));
            for (const [sym, exp] of Object.entries(t.vars)) {
              const c = KNOWN_CONSTANTS[sym];
              if (!c) return null;
              v *= Math.pow(c.approx, exp);
            }
            sum += v;
          }
          return Number.isFinite(sum) ? sum : null;
        }

        neg() {
          if (this.opaque) {
            return SymVal.fromOpaque(
              `-(${this.opaque.display})`,
              this.opaque.approx !== null ? -this.opaque.approx : null,
              this.opaque.symbols,
              this.opaque.hasRad,
              this.opaque.note
            );
          }
          const m = new Map();
          for (const [k, t] of this.terms.entries()) {
            m.set(k, { ...t, coef: t.coef.neg() });
          }
          return new SymVal(m);
        }

        add(other) {
          if (this.isZero()) return other;
          if (other.isZero()) return this;

          if (this.opaque || other.opaque) {
            // Cancelamento exato se displays forem opostos diretos
            if (this.opaque && other.opaque && this.opaque.display === `-(${other.opaque.display})`) {
              return SymVal.fromRat(Rat.zero());
            }
            const syms = new Set([...this.collectSymbols(), ...other.collectSymbols()]);
            const a1 = this.toApprox();
            const a2 = other.toApprox();
            const approx = (a1 !== null && a2 !== null) ? a1 + a2 : null;
            return SymVal.fromOpaque(
              `${this.toDisplayString()} + ${other.toDisplayString()}`,
              approx,
              syms,
              this.hasRadicals() || other.hasRadicals()
            );
          }

          const m = new Map(this.terms);
          for (const [k, t] of other.terms.entries()) {
            if (m.has(k)) {
              const sumCoef = m.get(k).coef.add(t.coef);
              if (sumCoef.isZero()) m.delete(k);
              else m.set(k, { ...t, coef: sumCoef });
            } else {
              m.set(k, { ...t });
            }
          }
          return new SymVal(m);
        }

        sub(other) {
          if (this.opaque && other.opaque && this.opaque.display === other.opaque.display) {
            return SymVal.fromRat(Rat.zero());
          }
          return this.add(other.neg());
        }

        mul(other) {
          if (this.isZero() || other.isZero()) return SymVal.fromRat(Rat.zero());

          if (this.opaque || other.opaque) {
            const syms = new Set([...this.collectSymbols(), ...other.collectSymbols()]);
            const a1 = this.toApprox();
            const a2 = other.toApprox();
            const approx = (a1 !== null && a2 !== null) ? a1 * a2 : null;
            return SymVal.fromOpaque(
              `(${this.toDisplayString()})·(${other.toDisplayString()})`,
              approx,
              syms,
              this.hasRadicals() || other.hasRadicals()
            );
          }

          const m = new Map();
          for (const t1 of this.terms.values()) {
            for (const t2 of other.terms.values()) {
              let coef = t1.coef.mul(t2.coef);
              const { square, free } = BigMath.splitSquareFree(t1.rad * t2.rad);
              if (square !== 1n) coef = coef.mul(new Rat(square, 1n));

              const mergedVars = { ...t1.vars };
              for (const [sym, exp] of Object.entries(t2.vars)) {
                mergedVars[sym] = (mergedVars[sym] || 0) + exp;
              }
              const normVars = SymVal.normalizeVars(mergedVars);
              const key = SymVal.keyOf(free, normVars);

              if (m.has(key)) {
                const c = m.get(key).coef.add(coef);
                if (c.isZero()) m.delete(key);
                else m.set(key, { coef: c, rad: free, vars: normVars });
              } else if (!coef.isZero()) {
                m.set(key, { coef, rad: free, vars: normVars });
              }
            }
          }
          return new SymVal(m);
        }

        div(other) {
          if (other.isZero()) {
            throw new DivisionByZeroError('Divisão por zero não é definida na matemática.');
          }
          if (this.isZero()) return SymVal.fromRat(Rat.zero());

          // Cancelamento direto de expressões idênticas: ex (x+1)/(x+1) = 1
          if (this.toDisplayString() === other.toDisplayString()) {
            return SymVal.fromRat(Rat.one());
          }

          // Divisor com um único termo -> divisão simbólica exata (ex: π/π = 1, 2x/x = 2, 1/√2 = √2/2)
          if (!this.opaque && !other.opaque && other.terms.size === 1) {
            const d = Array.from(other.terms.values())[0];
            const invCoef = Rat.one().div(d.coef.mul(new Rat(d.rad, 1n)));
            const invVars = {};
            for (const [sym, exp] of Object.entries(d.vars)) {
              invVars[sym] = -exp;
            }
            const invTerm = new SymVal(new Map([
              [SymVal.keyOf(d.rad, invVars), { coef: invCoef, rad: d.rad, vars: invVars }]
            ]));
            return this.mul(invTerm);
          }

          // Divisor binômio quadrático puro (sem símbolos) -> racionalização pelo conjugado
          if (!this.opaque && !other.opaque && other.terms.size === 2 && other.collectSymbols().size === 0) {
            const [t1, t2] = Array.from(other.terms.values());
            const conj = new SymVal(new Map([
              [SymVal.keyOf(t1.rad, {}), { ...t1 }],
              [SymVal.keyOf(t2.rad, {}), { ...t2, coef: t2.coef.neg() }]
            ]));
            const den = other.mul(conj);
            if (den.isZero()) throw new DivisionByZeroError('Divisão por zero detectada após simplificação.');
            if (den.terms.size === 1) return this.mul(conj).div(den);
          }

          // Demais quocientes envolvendo símbolos/irracionais
          const syms = new Set([...this.collectSymbols(), ...other.collectSymbols()]);
          const a1 = this.toApprox();
          const a2 = other.toApprox();
          const approx = (a1 !== null && a2 !== null && a2 !== 0) ? a1 / a2 : null;
          return SymVal.fromOpaque(
            `(${this.toDisplayString()}) / (${other.toDisplayString()})`,
            approx,
            syms,
            this.hasRadicals() || other.hasRadicals()
          );
        }

        sqrt() {
          if (this.isZero()) return SymVal.fromRat(Rat.zero());

          if (this.isRational()) {
            const r = this.asRat();
            if (r.isNeg()) {
              throw new ComplexNumberError(
                'Raiz quadrada de número negativo não pertence aos Reais (ℝ).',
                `Não existe número real x tal que x² = ${r.toString()}. O resultado pertence aos Números Complexos (ℂ).`
              );
            }
            const prod = r.n * r.d;
            const { square, free } = BigMath.splitSquareFree(prod);
            const coef = new Rat(square, r.d);
            return new SymVal(new Map([
              [SymVal.keyOf(free, {}), { coef, rad: free, vars: {} }]
            ]));
          }

          // Verifica se o valor aproximado conhecido é negativo (ex: √(1 - π))
          const approx = this.toApprox();
          if (approx !== null && approx < -1e-12) {
            throw new ComplexNumberError(
              'Raiz quadrada de número negativo não pertence aos Reais (ℝ).',
              `O valor dentro da raiz é negativo (≈ ${formatBR(approx)}), pertencendo aos Complexos (ℂ).`
            );
          }

          // Termo único com expoentes pares de símbolos (ex: √(π²) = π)
          if (!this.opaque && this.terms.size === 1) {
            const t = Array.from(this.terms.values())[0];
            const allEven = Object.values(t.vars).every((e) => e % 2 === 0);
            if (t.rad === 1n && allEven) {
              if (t.coef.isNeg()) {
                throw new ComplexNumberError('Raiz quadrada de número negativo não pertence aos Reais (ℝ).');
              }
              const subRoot = SymVal.fromRat(t.coef).sqrt();
              const halfVars = {};
              for (const [sym, exp] of Object.entries(t.vars)) {
                halfVars[sym] = exp / 2;
              }
              const varFactor = new SymVal(new Map([
                [SymVal.keyOf(1n, halfVars), { coef: Rat.one(), rad: 1n, vars: halfVars }]
              ]));
              return subRoot.mul(varFactor);
            }
          }

          return SymVal.fromOpaque(
            `√(${this.toDisplayString()})`,
            approx !== null && approx >= 0 ? Math.sqrt(approx) : null,
            this.collectSymbols(),
            true,
            'Raiz quadrada de expressão irracional ou simbólica.'
          );
        }

        cbrt() {
          if (this.isZero()) return SymVal.fromRat(Rat.zero());

          if (this.isRational()) {
            const r = this.asRat();
            const neg = r.isNeg();
            const rootN = BigMath.exactNthRoot(BigMath.abs(r.n), 3);
            const rootD = BigMath.exactNthRoot(r.d, 3);
            if (rootN !== null && rootD !== null) {
              return SymVal.fromRat(new Rat(neg ? -rootN : rootN, rootD));
            }
            const approx = Math.cbrt(r.toNumber());
            return SymVal.fromOpaque(
              `∛(${r.toString()})`,
              approx,
              [],
              true,
              `A raiz cúbica de ${r.toString()} não é exata nos racionais, possuindo representação decimal infinita e não periódica.`
            );
          }

          const approx = this.toApprox();
          return SymVal.fromOpaque(
            `∛(${this.toDisplayString()})`,
            approx !== null ? Math.cbrt(approx) : null,
            this.collectSymbols(),
            true,
            'Raiz cúbica de expressão irracional ou simbólica.'
          );
        }

        pow(expVal) {
          // Expoente racional
          if (expVal.isRational()) {
            const eRat = expVal.asRat();

            // Expoente inteiro
            if (eRat.isInt()) {
              const k = Number(eRat.n);
              if (!Number.isSafeInteger(k) || Math.abs(k) > 120) {
                throw new MathSyntaxError('Expoente fora do limite suportado (use até ±120).');
              }
              if (k === 0) {
                if (this.isZero()) throw new DivisionByZeroError('A expressão 0^0 é uma forma indeterminada.');
                return SymVal.fromRat(Rat.one());
              }
              if (this.isRational()) return SymVal.fromRat(this.asRat().powInt(k));
              if (!this.opaque && Math.abs(k) <= 20) {
                let base = this;
                let absK = Math.abs(k);
                let res = SymVal.fromRat(Rat.one());
                while (absK > 0) {
                  if (absK & 1) res = res.mul(base);
                  absK >>= 1;
                  if (absK > 0) base = base.mul(base);
                }
                return k > 0 ? res : SymVal.fromRat(Rat.one()).div(res);
              }
              const a = this.toApprox();
              return SymVal.fromOpaque(
                `(${this.toDisplayString()})^${k}`,
                a !== null ? Math.pow(a, k) : null,
                this.collectSymbols(),
                this.hasRadicals()
              );
            }

            // Expoente com denominador 2 -> raiz quadrada + potência
            if (eRat.d === 2n) {
              return this.sqrt().pow(SymVal.fromRat(new Rat(eRat.n, 1n)));
            }

            // Expoente com denominador 3 -> raiz cúbica + potência
            if (eRat.d === 3n) {
              return this.cbrt().pow(SymVal.fromRat(new Rat(eRat.n, 1n)));
            }

            // Expoente fracionário geral p/q com base racional
            if (this.isRational()) {
              const bRat = this.asRat();
              const q = Number(eRat.d);
              const p = Number(eRat.n);
              if (bRat.isNeg() && q % 2 === 0) {
                throw new ComplexNumberError(
                  'Raiz de índice par de número negativo não pertence aos Reais (ℝ).',
                  `(${bRat.toString()})^(${eRat.toString()}) exige raiz de índice par de valor negativo (Complexo ℂ).`
                );
              }
              if (bRat.isZero()) {
                if (p < 0) throw new DivisionByZeroError('Zero elevado a expoente negativo equivale a divisão por zero.');
                return SymVal.fromRat(Rat.zero());
              }
              if (q <= 20 && Math.abs(p) <= 40) {
                const neg = bRat.isNeg();
                const rN = BigMath.exactNthRoot(BigMath.abs(bRat.n), q);
                const rD = BigMath.exactNthRoot(bRat.d, q);
                if (rN !== null && rD !== null) {
                  return SymVal.fromRat(new Rat(neg ? -rN : rN, rD).powInt(p));
                }
              }
              const baseNum = bRat.toNumber();
              const approx = (bRat.isNeg() ? -1 : 1) * Math.pow(Math.abs(baseNum), p / q);
              return SymVal.fromOpaque(
                `(${bRat.toString()})^(${eRat.toString()})`,
                approx,
                [],
                true,
                `A raiz de índice ${q} de ${bRat.toString()} não é exata nos racionais.`
              );
            }
          }

          // Expoente simbólico / irracional (ex: 2^x, e^π)
          const syms = new Set([...this.collectSymbols(), ...expVal.collectSymbols()]);
          const a1 = this.toApprox();
          const a2 = expVal.toApprox();
          const approx = (a1 !== null && a2 !== null && a1 >= 0) ? Math.pow(a1, a2) : null;
          return SymVal.fromOpaque(
            `${this.toDisplayString()}^(${expVal.toDisplayString()})`,
            approx,
            syms,
            this.hasRadicals() || expVal.hasRadicals()
          );
        }

        toDisplayString() {
          if (this.opaque) return this.opaque.display;
          if (this.isZero()) return '0';
          if (this.isRational()) return this.asRat().toString();

          const sorted = Array.from(this.terms.values()).sort((a, b) => {
            const sA = (a.rad === 1n && Object.keys(a.vars).length === 0) ? 0 : 1;
            const sB = (b.rad === 1n && Object.keys(b.vars).length === 0) ? 0 : 1;
            return sA - sB;
          });

          let out = '';
          sorted.forEach((t, idx) => {
            const isNeg = t.coef.isNeg();
            const absCoef = t.coef.abs();
            const varKeys = Object.keys(t.vars);
            const hasSym = t.rad > 1n || varKeys.length > 0;

            let symPart = '';
            if (t.rad > 1n) symPart += `√${t.rad.toString()}`;
            varKeys.forEach((sym) => {
              const e = t.vars[sym];
              symPart += e === 1 ? sym : `${sym}^${e}`;
            });

            let termStr = '';
            if (!hasSym) {
              termStr = absCoef.toString();
            } else if (absCoef.isOne()) {
              termStr = symPart;
            } else if (absCoef.d === 1n) {
              termStr = `${absCoef.n.toString()}${symPart}`;
            } else if (absCoef.n === 1n) {
              termStr = `${symPart}/${absCoef.d.toString()}`;
            } else {
              termStr = `(${absCoef.toString()})${symPart}`;
            }

            out += idx === 0
              ? (isNeg ? '-' : '') + termStr
              : (isNeg ? ' - ' : ' + ') + termStr;
          });
          return out;
        }
      }

      /* =======================================================================
         3. PARSER DE DECIMAIS EXATOS E DÍZIMAS PERIÓDICAS
         ======================================================================= */
      function detectRepeatingPeriod(frac) {
        const len = frac.length;
        if (len < 3) return null;
        for (let p = 1; p <= Math.floor(len / 2); p++) {
          const minNeeded = p === 1 ? 3 : 2 * p;
          if (len < minNeeded) continue;
          for (let start = 0; start <= len - minNeeded; start++) {
            const period = frac.slice(start, start + p);
            let ok = true;
            for (let i = start; i < len; i++) {
              if (frac[i] !== period[(i - start) % p]) {
                ok = false;
                break;
              }
            }
            if (ok) return { nonRep: frac.slice(0, start), rep: period };
          }
        }
        return null;
      }

      function parseNumberLiteral(rawToken) {
        const clean = rawToken.replace(',', '.');

        // Dízima com parênteses: 0.(3), 0.1(6)
        const parenMatch = /^(\d+)\.(\d*)\((\d+)\)$/.exec(clean);
        if (parenMatch) {
          const [, intPart, nonRep, rep] = parenMatch;
          const allDigits = BigInt(intPart + nonRep + rep);
          const beforeRep = BigInt(intPart + nonRep);
          const num = allDigits - beforeRep;
          const den = (10n ** BigInt(rep.length) - 1n) * (10n ** BigInt(nonRep.length));
          const rat = new Rat(num, den);
          return { rat, meta: { kind: 'repeating', raw: rawToken, rep, fraction: rat.toString() } };
        }

        // Dízima com reticências: 0.333..., 1.2323...
        const dotsMatch = /^(\d+)\.(\d+)\.\.\.$/.exec(clean);
        if (dotsMatch) {
          const [, intPart, frac] = dotsMatch;
          const detected = detectRepeatingPeriod(frac);
          if (!detected) {
            throw new MathSyntaxError(`Período não identificado em "${rawToken}". Repita o período (ex.: 0,333... ou 1,2323...) ou use parênteses (ex.: 0,(3)).`);
          }
          const { nonRep, rep } = detected;
          const allDigits = BigInt(intPart + nonRep + rep);
          const beforeRep = BigInt(intPart + nonRep);
          const num = allDigits - beforeRep;
          const den = (10n ** BigInt(rep.length) - 1n) * (10n ** BigInt(nonRep.length));
          const rat = new Rat(num, den);
          return { rat, meta: { kind: 'repeating', raw: rawToken, rep, fraction: rat.toString() } };
        }

        // Decimal finito exato: 2.5, 3.14159265
        const decMatch = /^(\d+)\.(\d+)$/.exec(clean);
        if (decMatch) {
          const [, intPart, frac] = decMatch;
          const rat = new Rat(BigInt(intPart + frac), 10n ** BigInt(frac.length));
          return { rat, meta: { kind: 'decimal', raw: rawToken, decimals: frac.length, fraction: rat.toString() } };
        }

        // Inteiro
        if (/^\d+$/.test(clean)) {
          return { rat: new Rat(BigInt(clean), 1n), meta: { kind: 'integer', raw: rawToken } };
        }

        throw new MathSyntaxError(`Número malformado: "${rawToken}".`);
      }

      /* =======================================================================
         4. TOKENIZER & PARSER DESCENDENTE RECURSIVO (SEM eval())
            Reconhece funções (sqrt, raiz, cbrt), constantes (π, pi, e, φ, phi, τ, tau)
            e qualquer letra/símbolo literal (x, y, a, b, k, α, β...)
         ======================================================================= */
      const LETTER_REGEX = /^[a-zA-Z\u0370-\u03FF]$/;

      function tokenize(input) {
        const src = input
          .trim()
          .replace(/[−–—]/g, '-')
          .replace(/[×·]/g, '*')
          .replace(/÷/g, '/')
          .replace(/…/g, '...')
          .replace(/²/g, '^2')
          .replace(/³/g, '^3');

        if (!src) {
          throw new MathSyntaxError('Digite um número, expressão ou símbolo para analisar.');
        }

        const rawTokens = [];
        let i = 0;
        const n = src.length;

        while (i < n) {
          const ch = src[i];

          if (/\s/.test(ch)) {
            i++;
            continue;
          }

          // Números, decimais e dízimas
          if (/\d/.test(ch)) {
            const start = i;
            while (i < n && /\d/.test(src[i])) i++;

            if (i < n && (src[i] === '.' || src[i] === ',')) {
              if (src.slice(i, i + 3) === '...') {
                throw new MathSyntaxError('Use reticências após a parte decimal para dízimas (ex.: 0,333...).');
              }
              i++;
              const fracStart = i;
              while (i < n && /\d/.test(src[i])) i++;

              if (i < n && src[i] === '(') {
                const closeIdx = src.indexOf(')', i);
                if (closeIdx > i + 1 && /^\d+$/.test(src.slice(i + 1, closeIdx))) {
                  i = closeIdx + 1;
                } else if (i === fracStart) {
                  throw new MathSyntaxError('Formato de dízima periódica inválido.');
                }
              } else {
                if (i === fracStart) {
                  throw new MathSyntaxError('Faltam dígitos após a vírgula ou ponto decimal.');
                }
                if (src.slice(i, i + 3) === '...') i += 3;
              }

              if (i < n && (src[i] === '.' || src[i] === ',')) {
                throw new MathSyntaxError('Número inválido: mais de um separador decimal.');
              }
            }

            rawTokens.push({ type: 'NUMBER', value: src.slice(start, i) });
            continue;
          }

          // Raiz quadrada e raiz cúbica Unicode
          if (ch === '√') {
            rawTokens.push({ type: 'SQRT', value: '√' });
            i++;
            continue;
          }
          if (ch === '∛') {
            rawTokens.push({ type: 'CBRT', value: '∛' });
            i++;
            continue;
          }

          // Palavras e letras (funções válidas, constantes ou letras literais)
          if (LETTER_REGEX.test(ch)) {
            const start = i;
            while (i < n && LETTER_REGEX.test(src[i])) i++;
            const word = src.slice(start, i);
            const lower = word.toLowerCase();

            if (lower === 'sqrt' || lower === 'raiz') {
              rawTokens.push({ type: 'SQRT', value: lower });
            } else if (lower === 'cbrt') {
              rawTokens.push({ type: 'CBRT', value: lower });
            } else if (lower === 'pi' || word === 'π' || word === 'Π') {
              rawTokens.push({ type: 'SYMBOL', value: 'π' });
            } else if (lower === 'phi' || word === 'φ' || word === 'Φ') {
              rawTokens.push({ type: 'SYMBOL', value: 'φ' });
            } else if (lower === 'tau' || word === 'τ') {
              rawTokens.push({ type: 'SYMBOL', value: 'τ' });
            } else if (word === 'e' || word === 'E') {
              rawTokens.push({ type: 'SYMBOL', value: 'e' });
            } else {
              // Letras genéricas (ex: x, y, a, b, k, α, β, ou sequência como xy -> x * y)
              for (const letter of word) {
                const mapped = letter === 'π' || letter === 'Π' ? 'π'
                  : letter === 'φ' || letter === 'Φ' ? 'φ'
                    : letter === 'τ' ? 'τ' : letter;
                rawTokens.push({ type: 'SYMBOL', value: mapped });
              }
            }
            continue;
          }

          // Operadores e parênteses
          if ('+-*/^()'.includes(ch)) {
            const map = { '+': 'PLUS', '-': 'MINUS', '*': 'MUL', '/': 'DIV', '^': 'POW', '(': 'LPAREN', ')': 'RPAREN' };
            rawTokens.push({ type: map[ch], value: ch });
            i++;
            continue;
          }

          if (ch === '.' || ch === ',') {
            throw new MathSyntaxError(`Use um zero antes do separador decimal (ex.: 0${ch}5).`);
          }

          throw new MathSyntaxError(`Caractere não reconhecido: "${ch}".`);
        }

        // Multiplicação implícita: 2π, 3√2, 2x, xy, 2(3+1), (x)(y), πe
        const tokens = [];
        for (let k = 0; k < rawTokens.length; k++) {
          const curr = rawTokens[k];
          tokens.push(curr);
          if (k + 1 < rawTokens.length) {
            const next = rawTokens[k + 1];
            const prevEndsTerm = curr.type === 'NUMBER' || curr.type === 'SYMBOL' || curr.type === 'RPAREN';
            const nextStartsTerm = next.type === 'SYMBOL' || next.type === 'SQRT' || next.type === 'CBRT' || next.type === 'LPAREN';
            if (prevEndsTerm && nextStartsTerm) {
              tokens.push({ type: 'MUL', value: '*' });
            }
          }
        }

        return tokens;
      }

      function parseAndEvaluate(input) {
        const tokens = tokenize(input);
        let pos = 0;
        const literalMetas = [];
        let opCount = 0;

        const peek = () => tokens[pos] || null;
        const consume = () => tokens[pos++];

        function parseExpr() {
          let left = parseTerm();
          while (peek() && (peek().type === 'PLUS' || peek().type === 'MINUS')) {
            const op = consume().type;
            const right = parseTerm();
            opCount++;
            left = op === 'PLUS' ? left.add(right) : left.sub(right);
          }
          return left;
        }

        function parseTerm() {
          let left = parseUnary();
          while (peek() && (peek().type === 'MUL' || peek().type === 'DIV')) {
            const op = consume().type;
            const right = parseUnary();
            opCount++;
            left = op === 'MUL' ? left.mul(right) : left.div(right);
          }
          return left;
        }

        function parseUnary() {
          if (peek() && peek().type === 'PLUS') {
            consume();
            return parseUnary();
          }
          if (peek() && peek().type === 'MINUS') {
            consume();
            return parseUnary().neg();
          }
          return parsePower();
        }

        function parsePower() {
          let base = parseRadical();
          if (peek() && peek().type === 'POW') {
            consume();
            const exp = parseUnary();
            opCount++;
            base = base.pow(exp);
          }
          return base;
        }

        function parseRadical() {
          if (peek() && (peek().type === 'SQRT' || peek().type === 'CBRT')) {
            const kind = consume().type;
            opCount++;
            let arg;
            if (peek() && peek().type === 'MINUS') {
              consume();
              arg = parseRadical().neg();
            } else {
              arg = parseRadical();
            }
            return kind === 'SQRT' ? arg.sqrt() : arg.cbrt();
          }
          return parsePrimary();
        }

        function parsePrimary() {
          const tok = peek();
          if (!tok) throw new MathSyntaxError('Expressão incompleta.');
          if (tok.type === 'NUMBER') {
            consume();
            const parsed = parseNumberLiteral(tok.value);
            literalMetas.push(parsed.meta);
            return SymVal.fromRat(parsed.rat);
          }
          if (tok.type === 'SYMBOL') {
            consume();
            literalMetas.push({ kind: 'symbol', name: tok.value });
            return SymVal.fromSymbol(tok.value);
          }
          if (tok.type === 'LPAREN') {
            consume();
            const val = parseExpr();
            if (!peek() || peek().type !== 'RPAREN') {
              throw new MathSyntaxError('Parênteses não fechados: verifique se falta ")".');
            }
            consume();
            return val;
          }
          throw new MathSyntaxError(`Símbolo inesperado: "${tok.value}".`);
        }

        const value = parseExpr();
        if (pos < tokens.length) {
          throw new MathSyntaxError(`Trecho inesperado após a expressão: "${tokens[pos].value}".`);
        }

        return { value, literalMetas, opCount };
      }

      /* =======================================================================
         5. CLASSIFICADOR DIDÁTICO + EXPLICAÇÃO PASSO A PASSO
         ======================================================================= */
      function formatBR(num, digits = 8) {
        if (num === null || !Number.isFinite(num)) return '';
        return Number(num.toFixed(digits)).toString().replace('.', ',');
      }

      function normCompare(str) {
        return str.replace(/\s+/g, '').replace('.', ',').replace(/[−–]/g, '-');
      }

      function analyzeExpression(rawInput) {
        const input = rawInput.trim();
        try {
          const { value, literalMetas, opCount } = parseAndEvaluate(input);
          const simplified = value.toDisplayString();
          const approx = value.toApprox();

          const wasSimplified = opCount > 0 || (
            literalMetas.length === 1 &&
            (literalMetas[0].kind === 'repeating' || literalMetas[0].kind === 'decimal') &&
            normCompare(input) !== normCompare(simplified)
          );

          const singleRepeating = literalMetas.length === 1 && opCount === 0 && literalMetas[0].kind === 'repeating'
            ? literalMetas[0] : null;
          const singleDecimal = literalMetas.length === 1 && opCount === 0 && literalMetas[0].kind === 'decimal'
            ? literalMetas[0] : null;

          // -------------------------------------------------------------------
          // RAMO 1: RACIONAL EXATO (ℕ, ℤ ou ℚ)
          // -------------------------------------------------------------------
          if (value.isRational()) {
            const rat = value.asRat();
            const fracStr = rat.toString();
            const exactDec = rat.toExactDecimalBR(10);

            // 1A. NATURAL (ℕ)
            if (rat.isInt() && !rat.isNeg()) {
              const intStr = rat.n.toString();
              const simpSuffix = wasSimplified ? ` (pois ${input} = ${intStr})` : '';
              const steps = [];
              if (wasSimplified) {
                steps.push(`Simplificamos a expressão algebricamente: ${input} = ${intStr}.`);
              }
              steps.push(`O resultado ${intStr} não tem parte decimal nem sinal negativo.`);
              steps.push(`Logo, pertence aos Naturais (ℕ = {0, 1, 2, 3, ...}).`);
              steps.push(`Pela hierarquia ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ, também pertence a ℤ, ℚ (${intStr}/1) e ℝ, e não pertence a 𝕀.`);

              return {
                status: 'classified',
                primarySet: 'N',
                primaryLabel: 'NATURAL (ℕ)',
                input,
                simplified: intStr,
                wasSimplified,
                subline: wasSimplified ? `Simplificação exata: ${input} = ${intStr}` : 'Inteiro não negativo (ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ)',
                belongs: ['N', 'Z', 'Q', 'R'],
                memberships: {
                  N: { in: true, text: `É um número inteiro não negativo${simpSuffix}.` },
                  Z: { in: true, text: `Todo número natural também é inteiro (ℕ ⊂ ℤ).` },
                  Q: { in: true, text: `Pode ser escrito como a fração ${intStr}/1 (ℤ ⊂ ℚ).` },
                  I: { in: false, text: `É racional; Racionais e Irracionais são disjuntos (𝕀 ∩ ℚ = ∅).` },
                  R: { in: true, text: `Todo número racional é real (ℚ ⊂ ℝ).` }
                },
                steps,
                conclusion: `Conclusão: ${input}${wasSimplified ? ` (= ${intStr})` : ''} ∈ ℕ, ℤ, ℚ e ℝ.`
              };
            }

            // 1B. INTEIRO NEGATIVO (ℤ \ ℕ)
            if (rat.isInt() && rat.isNeg()) {
              const intStr = rat.n.toString();
              const simpSuffix = wasSimplified ? ` (pois ${input} = ${intStr})` : '';
              const steps = [];
              if (wasSimplified) {
                steps.push(`Simplificamos a expressão: ${input} = ${intStr}.`);
              }
              steps.push(`Por ser negativo, ${intStr} não pertence aos Naturais (ℕ).`);
              steps.push(`Como não possui parte decimal, pertence aos Inteiros (ℤ).`);
              steps.push(`Pode ser escrito como fração de denominador 1 (${intStr}/1), logo pertence a ℚ e a ℝ.`);

              return {
                status: 'classified',
                primarySet: 'Z',
                primaryLabel: 'INTEIRO (ℤ)',
                input,
                simplified: intStr,
                wasSimplified,
                subline: wasSimplified ? `Simplificação exata: ${input} = ${intStr}` : 'Inteiro negativo (ℤ ⊂ ℚ ⊂ ℝ)',
                belongs: ['Z', 'Q', 'R'],
                memberships: {
                  N: { in: false, text: `É negativo; os naturais contêm apenas inteiros ≥ 0.` },
                  Z: { in: true, text: `É um número inteiro negativo sem parte decimal${simpSuffix}.` },
                  Q: { in: true, text: `Pode ser escrito como a fração ${intStr}/1 (ℤ ⊂ ℚ).` },
                  I: { in: false, text: `É racional, portanto não pertence a 𝕀 (𝕀 ∩ ℚ = ∅).` },
                  R: { in: true, text: `Todo número racional é real (ℚ ⊂ ℝ).` }
                },
                steps,
                conclusion: `Conclusão: ${input}${wasSimplified ? ` (= ${intStr})` : ''} ∈ ℤ, ℚ e ℝ (e ∉ ℕ, 𝕀).`
              };
            }

            // 1C. RACIONAL NÃO INTEIRO (ℚ \ ℤ)
            const isExactDec = rat.hasTerminatingDecimal();
            const steps = [];
            if (singleRepeating) {
              steps.push(`Identificamos uma dízima periódica de período "${singleRepeating.rep}", cuja fração geratriz exata é ${fracStr}.`);
            } else if (wasSimplified) {
              steps.push(`Simplificamos para a fração irredutível ${fracStr}${exactDec ? ` (decimal exato ${exactDec})` : ''}.`);
            } else {
              steps.push(`O número está na forma de fração irredutível ${fracStr} entre dois inteiros com denominador não nulo.`);
            }
            if (singleDecimal && /^3[.,]14\d*$/.test(input) && singleDecimal.decimals >= 2) {
              steps.push(`Nota: embora lembre π, ${input} tem número finito de casas decimais (${singleDecimal.decimals}), portanto é uma fração exata (${fracStr}) e pertence a ℚ.`);
            }
            steps.push(`Possui parte decimal não nula, por isso não pertence a ℕ nem a ℤ.`);
            steps.push(`Por ser razão de dois inteiros (${fracStr}), pertence a ℚ e a ℝ (e não a 𝕀).`);

            const subline = exactDec && normCompare(exactDec) !== normCompare(input)
              ? `Fração: ${fracStr}  •  Decimal exato: ${exactDec}`
              : !exactDec
                ? `Fração: ${fracStr}  •  Decimal ≈ ${formatBR(approx, 6)}...`
                : `Fração equivalente: ${fracStr}`;

            return {
              status: 'classified',
              primarySet: 'Q',
              primaryLabel: 'RACIONAL (ℚ)',
              input,
              simplified: fracStr,
              wasSimplified: normCompare(input) !== normCompare(fracStr),
              subline,
              belongs: ['Q', 'R'],
              memberships: {
                N: { in: false, text: `Não é um número inteiro não negativo.` },
                Z: { in: false, text: `Possui parte decimal/fracionária (não é inteiro).` },
                Q: {
                  in: true,
                  text: singleRepeating
                    ? `É uma dízima periódica equivalente à fração ${fracStr}.`
                    : `Pode ser representado pela fração exata ${fracStr}.`
                },
                I: {
                  in: false,
                  text: singleRepeating
                    ? `Apesar de infinita, sua expansão decimal é periódica (não irracional).`
                    : isExactDec
                      ? `É um decimal exato (finito), não infinito e não periódico.`
                      : `Pode ser escrito como fração de inteiros (${fracStr}).`
                },
                R: { in: true, text: `Todo número racional é real (ℚ ⊂ ℝ).` }
              },
              steps,
              conclusion: `Conclusão: ${input}${normCompare(input) !== normCompare(fracStr) ? ` (= ${fracStr})` : ''} ∈ ℚ e ℝ (e ∉ ℕ, ℤ, 𝕀).`
            };
          }

          // -------------------------------------------------------------------
          // RAMO 2: IRRACIONAL (𝕀) — RADICAIS NÃO EXATOS, CONSTANTES E LETRAS
          // -------------------------------------------------------------------
          const symbols = Array.from(value.collectSymbols());
          const knownSyms = symbols.filter((s) => Boolean(KNOWN_CONSTANTS[s]));
          const genericLetters = symbols.filter((s) => !KNOWN_CONSTANTS[s]);
          const hasRad = value.hasRadicals();

          const steps = [];
          let irratReason = '';
          let subline = '';

          if (normCompare(input) !== normCompare(simplified)) {
            steps.push(`Simplificamos a expressão para ${simplified}.`);
          }

          if (genericLetters.length > 0) {
            // Regra solicitada: letra/símbolo literal remanescente -> assume Irracional (𝕀) e Real (ℝ)
            const lettersText = genericLetters.join(', ');
            irratReason = `Contém o símbolo literal "${lettersText}" não redutível a fração inteira; o analisador assume classificação como Irracional (𝕀).`;
            subline = `Símbolo literal detectado (${lettersText}) — assumido como Irracional (𝕀)`;
            steps.push(`O analisador detectou o símbolo literal "${lettersText}" remanescente após a simplificação (sem cancelamento algébrico).`);
            steps.push(`Como a expressão com "${lettersText}" não se reduz a uma fração de dois inteiros, este simulador assume sua classificação no conjunto dos Irracionais (𝕀).`);
            steps.push(`Por ser classificada em 𝕀, não pertence a ℚ, ℤ ou ℕ, mas pertence aos Reais (ℝ), pois 𝕀 ⊂ ℝ.`);
          } else if (knownSyms.length > 0) {
            const constNames = knownSyms.map((s) => KNOWN_CONSTANTS[s].name).join(' e ');
            const approxStr = approx !== null ? formatBR(approx, 8) : null;
            irratReason = `Envolve ${knownSyms.length === 1 ? KNOWN_CONSTANTS[knownSyms[0]].desc : `constantes irracionais (${constNames})`}, com representação decimal infinita e não periódica.`;
            subline = approxStr ? `Aproximação decimal: ≈ ${approxStr}... (infinita e não periódica)` : `Expressão com ${constNames}`;
            steps.push(`A expressão mantém ${constNames} após a simplificação${approxStr ? ` (valor aproximado: ${approxStr}...)` : ''}.`);
            steps.push(`Essa expressão possui expansão decimal infinita e não periódica, não podendo ser escrita como fração de inteiros.`);
            steps.push(`Portanto, pertence aos Irracionais (𝕀) e aos Reais (ℝ), ficando fora de ℕ, ℤ e ℚ.`);
          } else {
            // Radical não exato puro (√2, √3, ∛2, 2^(1/2), etc.)
            const approxStr = approx !== null ? formatBR(approx, 8) : null;
            irratReason = (value.opaque && value.opaque.note)
              ? value.opaque.note
              : `Envolve raiz não exata (${simplified}), cuja representação decimal é infinita e não periódica.`;
            subline = approxStr ? `Aproximação decimal: ≈ ${approxStr}... (infinita e não periódica)` : `Radical irracional: ${simplified}`;
            steps.push(`A raiz em "${simplified}" não resulta em um número racional exato${approxStr ? ` (≈ ${approxStr}...)` : ''}.`);
            steps.push(`Sua representação decimal é infinita e não periódica, logo não pode ser escrita como fração p/q de inteiros.`);
            steps.push(`Assim, pertence aos Irracionais (𝕀) e aos Reais (ℝ), e não pertence a ℕ, ℤ ou ℚ.`);
          }

          return {
            status: 'classified',
            primarySet: 'I',
            primaryLabel: 'IRRACIONAL (𝕀)',
            input,
            simplified,
            wasSimplified: normCompare(input) !== normCompare(simplified),
            subline,
            belongs: ['I', 'R'],
            memberships: {
              N: { in: false, text: `Não é um número inteiro não negativo.` },
              Z: { in: false, text: `Não representa um número inteiro.` },
              Q: { in: false, text: `Não se reduz a uma fração p/q de dois inteiros.` },
              I: { in: true, text: irratReason },
              R: { in: true, text: `Todo número irracional pertence ao conjunto dos Reais (𝕀 ⊂ ℝ).` }
            },
            steps,
            conclusion: `Conclusão: ${input} ∈ 𝕀 e ℝ (e ∉ ℕ, ℤ, ℚ).`
          };

        } catch (err) {
          // -------------------------------------------------------------------
          // RAMO 3: COMPLEXO (ℂ \ ℝ), INDEFINIDO (5/0) OU ERRO DE SINTAXE
          // -------------------------------------------------------------------
          if (err instanceof ComplexNumberError) {
            return {
              status: 'complex',
              primarySet: 'C',
              primaryLabel: 'NÃO REAL — COMPLEXO (ℂ)',
              input,
              subline: 'Fora do conjunto dos Números Reais (ℝ)',
              message: err.message,
              detail: err.detail,
              belongs: [],
              memberships: {
                N: { in: false, text: 'Não pertence, pois não é um número real.' },
                Z: { in: false, text: 'Não pertence, pois não é um número real.' },
                Q: { in: false, text: 'Não pertence, pois não é um número real.' },
                I: { in: false, text: 'Não pertence, pois os irracionais estão contidos em ℝ.' },
                R: { in: false, text: 'Nenhum número real elevado a expoente par produz valor negativo.' }
              },
              steps: [
                `Ao avaliar "${input}", encontramos uma raiz de índice par de um número negativo.`,
                `Em ℝ, o quadrado de qualquer número é sempre maior ou igual a zero.`,
                `Logo, "${input}" está fora de ℝ e pertence aos Números Complexos (ℂ), definidos com i = √(-1).`
              ],
              conclusion: `Conclusão: ${input} ∉ ℝ (e ∉ ℕ, ℤ, ℚ, 𝕀) — pertence aos Complexos (ℂ).`
            };
          }

          if (err instanceof DivisionByZeroError) {
            return {
              status: 'undefined',
              primarySet: 'ERR',
              primaryLabel: 'INDEFINIDO',
              input,
              subline: 'Expressão matematicamente indefinida (fora de ℝ)',
              message: err.message,
              detail: 'Na definição dos racionais ℚ = {p/q}, o denominador deve ser sempre diferente de zero (q ≠ 0).',
              belongs: [],
              memberships: {
                N: { in: false, text: 'Expressão indefinida não pertence a nenhum conjunto.' },
                Z: { in: false, text: 'Expressão indefinida não pertence a nenhum conjunto.' },
                Q: { in: false, text: 'Exige denominador q ≠ 0 na definição de fração racional.' },
                I: { in: false, text: 'Não define um número real.' },
                R: { in: false, text: 'Divisão por zero não tem resultado em ℝ.' }
              },
              steps: [
                `Ao calcular "${input}", ocorre uma divisão por zero (ou forma indeterminada).`,
                `Não existe número real x que satisfaça x · 0 = a para a ≠ 0.`,
                `Por isso, a expressão é indefinida e não pertence a ℕ, ℤ, ℚ, 𝕀 ou ℝ.`
              ],
              conclusion: `Conclusão: "${input}" é indefinido e está fora de todos os conjuntos reais.`
            };
          }

          return {
            status: 'error',
            primarySet: 'ERR',
            primaryLabel: 'ENTRADA INVÁLIDA',
            input,
            subline: 'Verifique a sintaxe da expressão',
            message: err.message || 'Expressão inválida.',
            detail: 'Exemplos aceitos: 7, -3, 3/4, 2,5, 0,333..., √2, √16, ∛8, π, φ, x, 2x + 1, √(-4), 5/0.',
            belongs: null,
            memberships: null,
            steps: [
              `Não foi possível interpretar "${input || '(vazio)'}".`,
              `Use vírgula ou ponto para decimais (2,5), barra para frações (3/4), √ ou ∛ para raízes e letras/constantes (π, e, φ, x).`
            ],
            conclusion: `Ajuste a entrada e clique em "Analisar".`
          };
        }
      }

      /* =======================================================================
         6. CONTROLADOR DO DIAGRAMA SVG (ILUMINAÇÃO POR HIERARQUIA, SEM BOLINHA)
         ======================================================================= */
      const Diagram = {
        regions: Array.from(document.querySelectorAll('.svg-region')),
        pills: Array.from(document.querySelectorAll('.set-pill')),
        statusBar: document.getElementById('diagramStatusBar'),
        relationTag: document.getElementById('diagramRelationTag'),
        statusText: document.getElementById('diagramStatusText'),
        selectedMode: 'ALL',

        init(onSelectSet) {
          this.onSelectSet = onSelectSet;

          // Clique nas pills superiores
          this.pills.forEach((pill) => {
            pill.addEventListener('click', () => {
              const target = pill.dataset.select;
              this.selectSet(target, true);
            });
          });

          // Clique direto nas regiões do SVG (clicar no mesmo volta para "Todos")
          this.regions.forEach((region) => {
            const code = region.dataset.set;
            const handleActivate = () => {
              const next = this.selectedMode === code ? 'ALL' : code;
              this.selectSet(next, true);
            };

            region.addEventListener('click', (e) => {
              e.stopPropagation();
              handleActivate();
            });

            region.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                handleActivate();
              }
            });
          });
        },

        /**
         * Seleciona um conjunto diretamente (via botão ou SVG):
         * Colore todos os conjuntos relacionados pela hierarquia e apaga os demais.
         */
        selectSet(code, notifyUI = false) {
          this.selectedMode = code;
          this.updatePillStates(code);
          this.statusBar.classList.remove('status-outside', 'status-error');
          this.relationTag.classList.remove('accent');

          if (code === 'ALL') {
            this.regions.forEach((r) => r.classList.remove('is-lit', 'is-dimmed', 'is-primary'));
            this.relationTag.textContent = 'ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ  |  𝕀 ⊂ ℝ';
            this.statusText.textContent = 'Visualização completa — clique em um conjunto para destacar sua hierarquia.';
          } else {
            const litSets = INCLUSION_MAP[code];
            this.regions.forEach((r) => {
              const setCode = r.dataset.set;
              const isLit = litSets.includes(setCode);
              r.classList.toggle('is-lit', isLit);
              r.classList.toggle('is-dimmed', !isLit);
              r.classList.toggle('is-primary', setCode === code);
            });

            const info = SET_INFO[code];
            this.relationTag.textContent = info.relation;
            this.statusText.textContent = info.statusLine;
          }

          if (notifyUI && this.onSelectSet) {
            this.onSelectSet(code);
          }
        },

        /**
         * Destaca exatamente os conjuntos aos quais o número analisado pertence (sem bolinha).
         */
        applyAnalysis(analysis) {
          this.statusBar.classList.remove('status-outside', 'status-error');
          this.relationTag.classList.remove('accent');

          if (analysis.status === 'classified') {
            this.selectedMode = analysis.primarySet;
            this.updatePillStates(analysis.primarySet);

            this.regions.forEach((r) => {
              const setCode = r.dataset.set;
              const isMember = analysis.belongs.includes(setCode);
              r.classList.toggle('is-lit', isMember);
              r.classList.toggle('is-dimmed', !isMember);
              r.classList.toggle('is-primary', setCode === analysis.primarySet);
            });

            const belongsSymbols = analysis.belongs.map((c) => SET_INFO[c].symbol).join(', ');
            const displayVal = analysis.wasSimplified && analysis.simplified.length <= 12
              ? `${analysis.input} = ${analysis.simplified}`
              : analysis.input;
            this.relationTag.classList.add('accent');
            this.relationTag.textContent = `${displayVal} ∈ ${belongsSymbols}`;
            this.statusText.textContent = `Classificação principal: ${analysis.primaryLabel} — conjuntos relacionados destacados no diagrama.`;
            return;
          }

          if (analysis.status === 'complex' || analysis.status === 'undefined') {
            this.selectedMode = 'NONE';
            this.updatePillStates(null);
            this.regions.forEach((r) => {
              r.classList.remove('is-lit', 'is-primary');
              r.classList.add('is-dimmed');
            });

            this.statusBar.classList.add(analysis.status === 'complex' ? 'status-outside' : 'status-error');
            this.relationTag.textContent = analysis.status === 'complex'
              ? `${analysis.input} ∉ ℝ  (Complexo ℂ)`
              : `${analysis.input} — Indefinido`;
            this.statusText.textContent = analysis.status === 'complex'
              ? 'Fora dos Números Reais (ℝ): nenhuma região real contém esta expressão.'
              : 'Fora dos Números Reais (ℝ): divisão por zero não pertence a nenhum conjunto numérico.';
            return;
          }

          // Erro de sintaxe: mantém estado limpo
          this.selectSet('ALL', false);
        },

        updatePillStates(activeCode) {
          this.pills.forEach((p) => {
            p.classList.toggle('active', p.dataset.select === activeCode);
          });
        }
      };

      /* =======================================================================
         7. CONTROLADOR DE INTERFACE (ABAS, RESUMO, HISTÓRICO E GLOSSÁRIO)
         ======================================================================= */
      const STORAGE_KEY = 'simulador_conjuntos_v2_hist';

      const UI = {
        form: document.getElementById('analyzerForm'),
        input: document.getElementById('exprInput'),
        clearBtn: document.getElementById('clearInputBtn'),
        clearHistoryBtn: document.getElementById('clearHistoryBtn'),
        summaryExpr: document.getElementById('summaryExpr'),
        summarySub: document.getElementById('summarySub'),
        summaryBadge: document.getElementById('summaryBadge'),
        membershipPills: Array.from(document.querySelectorAll('#membershipPills .m-pill')),
        tabBtns: Array.from(document.querySelectorAll('.tab-btn')),
        tabPanes: {
          analysis: document.getElementById('tab-analysis'),
          set: document.getElementById('tab-set'),
          history: document.getElementById('tab-history')
        },
        historyContainer: document.getElementById('historyContainer'),
        glossaryList: document.getElementById('glossaryList'),
        activeSetCode: 'N',
        history: [],

        init() {
          this.loadHistory();
          this.renderGlossary();
          this.renderHistory();
          this.renderSetTab('N');

          Diagram.init((selectedCode) => {
            if (selectedCode !== 'ALL') {
              this.activeSetCode = selectedCode;
              this.renderSetTab(selectedCode);
              this.switchTab('set');
            }
          });

          this.bindEvents();

          // Demonstração inicial limpa
          this.runAnalysis('2,5', false);
        },

        bindEvents() {
          this.form.addEventListener('submit', (e) => {
            e.preventDefault();
            this.runAnalysis(this.input.value, true);
          });

          this.clearBtn.addEventListener('click', () => {
            this.input.value = '';
            this.input.focus();
          });

          // Atalhos de símbolos inseridos no cursor
          document.querySelectorAll('.sym-btn').forEach((btn) => {
            btn.addEventListener('click', () => this.insertAtCursor(btn.dataset.insert));
          });

          // Exemplos rápidos clicáveis
          document.querySelectorAll('.quick-ex').forEach((btn) => {
            btn.addEventListener('click', () => {
              this.input.value = btn.dataset.expr;
              this.runAnalysis(btn.dataset.expr, true);
            });
          });

          // Navegação entre as 3 abas
          this.tabBtns.forEach((btn) => {
            btn.addEventListener('click', () => this.switchTab(btn.dataset.tab));
          });

          // Limpar histórico
          this.clearHistoryBtn.addEventListener('click', () => {
            this.history = [];
            this.saveHistory();
            this.renderHistory();
          });
        },

        insertAtCursor(text) {
          const el = this.input;
          const start = el.selectionStart ?? el.value.length;
          const end = el.selectionEnd ?? el.value.length;
          el.value = el.value.slice(0, start) + text + el.value.slice(end);
          const pos = start + text.length;
          el.focus();
          el.setSelectionRange(pos, pos);
        },

        switchTab(tabName) {
          this.tabBtns.forEach((btn) => {
            const active = btn.dataset.tab === tabName;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-selected', String(active));
          });
          Object.entries(this.tabPanes).forEach(([key, pane]) => {
            pane.classList.toggle('active', key === tabName);
          });
        },

        runAnalysis(expression, recordHistory = true) {
          this.input.value = expression;
          const result = analyzeExpression(expression);

          this.renderSummary(result);
          this.renderAnalysisTab(result);
          Diagram.applyAnalysis(result);
          this.switchTab('analysis');

          if (result.status === 'classified') {
            this.activeSetCode = result.primarySet;
            this.renderSetTab(result.primarySet);
          }

          if (recordHistory && result.status !== 'error') {
            this.pushHistory(result);
          }
        },

        renderSummary(res) {
          if (res.status === 'classified' && res.wasSimplified) {
            this.summaryExpr.textContent = `${res.input} = ${res.simplified}`;
          } else {
            this.summaryExpr.textContent = res.input || '—';
          }
          this.summarySub.textContent = res.subline || '';

          this.summaryBadge.textContent = res.primaryLabel;
          this.summaryBadge.className = `primary-badge bg-${res.primarySet}`;

          this.membershipPills.forEach((pill) => {
            const code = pill.dataset.set;
            const sym = SET_INFO[code].symbol;
            const isIn = Array.isArray(res.belongs) && res.belongs.includes(code);
            pill.classList.toggle('in', isIn);
            pill.textContent = `${isIn ? '∈' : '∉'} ${sym}`;
            pill.title = isIn ? `Pertence a ${SET_INFO[code].name}` : `Não pertence a ${SET_INFO[code].name}`;
          });
        },

        renderAnalysisTab(res) {
          const pane = this.tabPanes.analysis;
          pane.innerHTML = '';

          // Aviso para Complexo, Indefinido ou Erro de sintaxe
          if (res.status !== 'classified') {
            const banner = document.createElement('div');
            banner.className = `alert-banner ${res.status === 'complex' ? 'complex' : 'error'}`;
            const strong = document.createElement('strong');
            strong.textContent = res.message + ' ';
            banner.appendChild(strong);
            if (res.detail) {
              const span = document.createElement('span');
              span.textContent = res.detail;
              banner.appendChild(span);
            }
            pane.appendChild(banner);
          }

          // Lista objetiva de pertencimento (∈ / ∉) por conjunto
          if (res.memberships) {
            const ul = document.createElement('ul');
            ul.className = 'detail-list';

            SET_ORDER.forEach((code) => {
              const info = SET_INFO[code];
              const m = res.memberships[code];
              const li = document.createElement('li');
              li.className = `detail-item ${m.in ? 'is-in' : 'is-out'}`;

              const sym = document.createElement('span');
              sym.className = 'detail-sym';
              sym.textContent = `${m.in ? '∈' : '∉'} ${info.symbol}`;

              const txt = document.createElement('span');
              txt.textContent = m.text;

              li.appendChild(sym);
              li.appendChild(txt);
              ul.appendChild(li);
            });

            pane.appendChild(ul);
          }

          // Bloco "Entenda a classificação"
          const box = document.createElement('div');
          box.className = 'explain-box';

          const title = document.createElement('div');
          title.className = 'explain-title';
          title.innerHTML = '<span class="dot"></span>Entenda a classificação';

          const ol = document.createElement('ol');
          ol.className = 'steps-list';
          (res.steps || []).forEach((step, idx) => {
            const li = document.createElement('li');
            const badge = document.createElement('span');
            badge.className = 'step-idx';
            badge.textContent = String(idx + 1);
            const text = document.createElement('span');
            text.textContent = step;
            li.appendChild(badge);
            li.appendChild(text);
            ol.appendChild(li);
          });

          const conc = document.createElement('div');
          conc.className = 'explain-conclusion';
          conc.textContent = res.conclusion || '';

          box.appendChild(title);
          box.appendChild(ol);
          box.appendChild(conc);
          pane.appendChild(box);
        },

        renderSetTab(code) {
          const info = SET_INFO[code] || SET_INFO.N;
          const pane = this.tabPanes.set;
          pane.innerHTML = '';

          const card = document.createElement('div');
          card.className = 'set-info-card';

          const head = document.createElement('div');
          head.className = 'set-info-head';

          const avatar = document.createElement('div');
          avatar.className = 'set-info-avatar';
          avatar.style.background = info.color;
          avatar.textContent = info.symbol;

          const headText = document.createElement('div');
          const h3 = document.createElement('h3');
          h3.textContent = `${info.name} (${info.symbol})`;
          const pSub = document.createElement('p');
          pSub.textContent = info.statusLine;
          headText.appendChild(h3);
          headText.appendChild(pSub);

          head.appendChild(avatar);
          head.appendChild(headText);

          const meta = document.createElement('div');
          meta.className = 'set-info-meta';

          const m1 = document.createElement('div');
          m1.className = 'meta-tile';
          m1.innerHTML = `<small>Notação Matemática</small><span></span>`;
          m1.querySelector('span').textContent = info.notation;

          const m2 = document.createElement('div');
          m2.className = 'meta-tile';
          m2.innerHTML = `<small>Hierarquia de Inclusão</small><span></span>`;
          m2.querySelector('span').textContent = info.relation;

          meta.appendChild(m1);
          meta.appendChild(m2);

          const desc = document.createElement('p');
          desc.className = 'set-info-desc';
          desc.textContent = info.definition;

          const exRow = document.createElement('div');
          exRow.className = 'set-info-examples';
          const lbl = document.createElement('span');
          lbl.className = 'row-label';
          lbl.textContent = 'Testar exemplos';
          exRow.appendChild(lbl);

          info.examples.forEach((ex) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'quick-ex';
            btn.textContent = ex;
            btn.addEventListener('click', () => this.runAnalysis(ex, true));
            exRow.appendChild(btn);
          });

          card.appendChild(head);
          card.appendChild(meta);
          card.appendChild(desc);
          card.appendChild(exRow);
          pane.appendChild(card);
        },

        renderGlossary() {
          this.glossaryList.innerHTML = '';
          SET_ORDER.forEach((code) => {
            const info = SET_INFO[code];
            const row = document.createElement('div');
            row.className = 'glossary-row';
            row.setAttribute('role', 'button');
            row.setAttribute('tabindex', '0');

            const badge = document.createElement('span');
            badge.className = 'g-badge';
            badge.style.background = info.color;
            badge.textContent = info.symbol;

            const body = document.createElement('div');
            const strong = document.createElement('strong');
            strong.textContent = `${info.name}: `;
            body.appendChild(strong);
            body.appendChild(document.createTextNode(info.shortGloss));

            row.appendChild(badge);
            row.appendChild(body);

            const focusSet = () => Diagram.selectSet(code, true);
            row.addEventListener('click', focusSet);
            row.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                focusSet();
              }
            });

            this.glossaryList.appendChild(row);
          });
        },

        pushHistory(res) {
          const item = {
            input: res.input,
            label: res.primaryLabel,
            badgeType: res.primarySet
          };
          this.history = this.history.filter((h) => h.input !== item.input);
          this.history.unshift(item);
          if (this.history.length > 14) this.history.pop();
          this.saveHistory();
          this.renderHistory();
        },

        renderHistory() {
          this.historyContainer.innerHTML = '';
          if (this.history.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-msg';
            empty.textContent = 'Nenhuma análise no histórico ainda. Experimente digitar um número ou letra acima.';
            this.historyContainer.appendChild(empty);
            return;
          }

          const list = document.createElement('div');
          list.className = 'history-list';

          this.history.forEach((item) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'history-row';

            const expr = document.createElement('span');
            expr.className = 'history-expr';
            expr.textContent = item.input;

            const tag = document.createElement('span');
            tag.className = `history-tag bg-${item.badgeType}`;
            tag.textContent = item.label;

            btn.appendChild(expr);
            btn.appendChild(tag);
            btn.addEventListener('click', () => this.runAnalysis(item.input, false));
            list.appendChild(btn);
          });

          this.historyContainer.appendChild(list);
        },

        saveHistory() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.history));
          } catch (_) {
            // Storage indisponível em modo restrito
          }
        },

        loadHistory() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) this.history = parsed.slice(0, 14);
            }
          } catch (_) {
            this.history = [];
          }
        }
      };

      document.addEventListener('DOMContentLoaded', () => UI.init());
    })();
  </script>
</body>
</html>
